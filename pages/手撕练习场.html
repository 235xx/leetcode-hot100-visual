<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>手撕练习场</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
  /* layout: workbench — rail (today's plan, question list, history) | brief (task, explanation, answer) | bench (editor over test console) */
  :root {
    --bg: #eef1f5;
    --surface: #ffffff;
    --surface-2: #f4f6f9;
    --ink: #141a24;
    --muted: #5a6475;
    --faint: #8b94a3;
    --line: #d9dee6;
    --accent: #2a55c9;
    --accent-soft: rgba(42, 85, 201, 0.12);
    --on-accent: #ffffff;
    --ok: #1e8a4b;
    --ok-soft: rgba(30, 138, 75, 0.12);
    --bad: #c43240;
    --bad-soft: rgba(196, 50, 64, 0.1);
    --warn: #a95b08;
    --warn-soft: rgba(169, 91, 8, 0.12);
    --code-bg: #fbfcfd;
    --select: rgba(42, 85, 201, 0.18);
    --active-line: rgba(42, 85, 201, 0.05);
    --t-k: #0000ff;
    --t-k2: #af00db;
    --t-s: #a31515;
    --t-n: #098658;
    --t-c: #008000;
    --t-f: #795e26;
    --t-v: #001080;
    --t-t: #267f99;
    --heat-0: #e3e7ee;
    --font-sans: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0d1117;
      --surface: #151b24;
      --surface-2: #1b2230;
      --ink: #e4e9f0;
      --muted: #9ba6b7;
      --faint: #6b7586;
      --line: #29323f;
      --accent: #7c9cff;
      --accent-soft: rgba(124, 156, 255, 0.16);
      --on-accent: #0d1117;
      --ok: #4cc47f;
      --ok-soft: rgba(76, 196, 127, 0.15);
      --bad: #ff6b76;
      --bad-soft: rgba(255, 107, 118, 0.13);
      --warn: #f0a050;
      --warn-soft: rgba(240, 160, 80, 0.14);
      --code-bg: #10151d;
      --select: rgba(124, 156, 255, 0.26);
      --active-line: rgba(124, 156, 255, 0.06);
      --t-k: #569cd6;
      --t-k2: #c586c0;
      --t-s: #ce9178;
      --t-n: #b5cea8;
      --t-c: #6a9955;
      --t-f: #dcdcaa;
      --t-v: #9cdcfe;
      --t-t: #4ec9b0;
      --heat-0: #1e2632;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d1117;
    --surface: #151b24;
    --surface-2: #1b2230;
    --ink: #e4e9f0;
    --muted: #9ba6b7;
    --faint: #6b7586;
    --line: #29323f;
    --accent: #7c9cff;
    --accent-soft: rgba(124, 156, 255, 0.16);
    --on-accent: #0d1117;
    --ok: #4cc47f;
    --ok-soft: rgba(76, 196, 127, 0.15);
    --bad: #ff6b76;
    --bad-soft: rgba(255, 107, 118, 0.13);
    --warn: #f0a050;
    --warn-soft: rgba(240, 160, 80, 0.14);
    --code-bg: #10151d;
    --select: rgba(124, 156, 255, 0.26);
    --active-line: rgba(124, 156, 255, 0.06);
    --t-k: #569cd6;
    --t-k2: #c586c0;
    --t-s: #ce9178;
    --t-n: #b5cea8;
    --t-c: #6a9955;
    --t-f: #dcdcaa;
    --t-v: #9cdcfe;
    --t-t: #4ec9b0;
    --heat-0: #1e2632;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 14.5px;
    line-height: 1.65;
  }
  button, select { font: inherit; }
  code, .mono { font-family: var(--font-mono); font-size: 0.9em; }
  :where(p, li, dd, td) code {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0 4px;
  }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { max-width: 1520px; margin: 0 auto; padding-inline: 18px; padding-block: 16px 40px; display: grid; gap: 14px; }

  /* top bar */
  .topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 38px;
    height: 38px;
    border-radius: 9px;
    background: var(--ink);
    color: var(--bg);
    display: grid;
    place-items: center;
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 15px;
  }
  .brand h1 { margin: 0; font-size: 20px; font-weight: 900; line-height: 1.2; letter-spacing: 0.01em; }
  .brand p { margin: 0; font-size: 12.5px; color: var(--muted); }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; }
  .top-right { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  .site-nav { display: flex; gap: 2px; }
  .site-nav a { font-size: 13px; color: var(--muted); text-decoration: none; padding: 6px 10px; border-radius: 8px; white-space: nowrap; }
  .site-nav a:hover { background: var(--surface); color: var(--ink); }
  .plan-empty a { color: var(--accent); }
  .stat {
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--line);
    font-size: 13px;
    color: var(--muted);
  }
  .stat b { font-family: var(--font-mono); font-size: 15px; color: var(--ink); font-variant-numeric: tabular-nums; }

  /* main grid */
  .layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 14px; align-items: start; }
  .work { display: grid; gap: 12px; min-width: 0; }
  .panes { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 12px; align-items: start; }
  @media (max-width: 1279px) {
    /* narrower viewers (e.g. the claude.ai side panel): the editor must be on the first screen */
    .layout { grid-template-columns: minmax(0, 1fr); }
    .rail { order: 2; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); align-items: start; }
  }
  @media (max-width: 899px) {
    .panes { grid-template-columns: minmax(0, 1fr); }
    .tabpanel { max-height: 36vh; overflow-y: auto; }
  }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }

  /* rail */
  .rail { display: grid; gap: 12px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
  @media (max-width: 1279px) { .rail { position: static; } }
  .rail-sec { padding: 12px 12px 14px; display: grid; gap: 8px; }
  .rail-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .rail h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; }
  .rail select {
    font-size: 12.5px;
    padding: 2px 4px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
  }
  .rail label { font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
  .plan, .qlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .qbtn {
    width: 100%;
    display: grid;
    grid-template-columns: 22px minmax(0, 1fr) auto;
    gap: 8px;
    align-items: center;
    padding: 7px 8px;
    border-radius: 8px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink);
    text-align: left;
    cursor: pointer;
  }
  .qbtn:hover { background: var(--surface-2); }
  .qbtn[aria-current="true"] { background: var(--accent-soft); border-color: var(--accent); }
  .qbtn .num { font-family: var(--font-mono); font-size: 12px; color: var(--faint); text-align: center; }
  .qbtn .name { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qbtn .sub { display: block; font-size: 11.5px; color: var(--faint); }
  .plan .qbtn.done .name { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
  .check { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line); display: inline-grid; place-items: center; font-size: 11px; }
  .done .check { background: var(--ok); border-color: var(--ok); color: var(--surface); }
  .qlist-tier { padding: 8px 8px 2px; font-size: 11.5px; color: var(--faint); letter-spacing: 0.04em; }
  .qlist-tier:first-child { padding-top: 0; }
  .plan-empty { margin: 0; font-size: 13px; color: var(--muted); }

  .pill {
    font-size: 11.5px;
    line-height: 1.5;
    padding: 1px 7px;
    border-radius: 999px;
    white-space: nowrap;
    border: 1px solid var(--line);
    color: var(--muted);
    background: var(--surface);
  }
  .pill.new { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .pill.due { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }
  .pill.today { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); }
  .pill.mastered { color: var(--ok); border-color: transparent; background: var(--ok-soft); }

  .heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 11px); gap: 3px; justify-content: start; }
  .heat i { width: 11px; height: 11px; border-radius: 2px; background: var(--heat-0); }
  .heat i[data-n="1"] { background: color-mix(in srgb, var(--ok) 40%, var(--heat-0)); }
  .heat i[data-n="2"] { background: color-mix(in srgb, var(--ok) 70%, var(--heat-0)); }
  .heat i[data-n="3"] { background: var(--ok); }
  .heat i.today { outline: 1.5px solid var(--ink); outline-offset: 0; }
  .heat-legend { display: flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--faint); }
  .heat-legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; background: var(--heat-0); }
  .sync { margin: 0; font-size: 12px; color: var(--faint); display: flex; align-items: center; gap: 6px; }
  .sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
  .sync[data-mode="db"]::before { background: var(--ok); }
  .sync[data-mode="error"]::before { background: var(--bad); }

  /* question header */
  .qhead { padding: 14px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
  .qhead-title { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex: 1 1 260px; }
  .qhead .rank { font-family: var(--font-mono); font-size: 13px; color: var(--accent); white-space: nowrap; }
  .qhead h2 { margin: 0; font-size: 21px; font-weight: 700; text-wrap: balance; }
  .qhead-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 13px; color: var(--muted); }
  .qpick { display: none; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .qpick select {
    font-size: 13.5px;
    padding: 4px 6px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    max-width: 100%;
  }
  @media (max-width: 1279px) { .qpick { display: inline-flex; } }
  .timer { font-family: var(--font-mono); font-size: 15px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .timer.over { color: var(--warn); }
  .timer.finished { color: var(--ok); }

  /* brief */
  .brief { display: grid; min-width: 0; }
  .tabs { display: flex; gap: 2px; padding: 6px 6px 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tab {
    padding: 8px 14px;
    border: 0;
    border-bottom: 2px solid transparent;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
    font-size: 14px;
  }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 500; }
  .tabpanel { padding: 14px 16px 18px; display: grid; gap: 12px; min-width: 0; }
  .prose { display: grid; gap: 10px; }
  .prose > * { margin: 0; max-width: 68ch; }
  .prose ul, .prose ol { padding-left: 1.3em; display: grid; gap: 4px; }
  .prose h3 { font-size: 14px; font-weight: 700; margin-top: 4px; }
  .prose .bonus { padding: 8px 10px; border-radius: 8px; background: var(--surface-2); font-size: 13.5px; }
  .prose .idea { padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; }
  .sig { margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--code-bg); border: 1px solid var(--line); font-family: var(--font-mono); font-size: 12.5px; overflow-x: auto; white-space: pre; }
  .testnames { list-style: none; padding: 0; margin: 0; display: grid; gap: 3px; font-size: 13px; color: var(--muted); }
  .testnames li::before { content: "○ "; color: var(--faint); }
  .testnames li.bonus::before { content: "☆ "; }
  details.qa { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; background: var(--surface); }
  details.qa + details.qa { margin-top: -4px; }
  details.qa summary { cursor: pointer; font-weight: 500; }
  details.qa p { margin: 6px 0 2px; color: var(--muted); }
  .anim-link { font-size: 13.5px; }
  .answer-gate { display: grid; gap: 10px; justify-items: start; padding: 14px; border: 1px dashed var(--line); border-radius: 8px; }
  .answer-gate p { margin: 0; color: var(--muted); font-size: 13.5px; }
  .solution { margin: 0; padding: 12px 14px; border-radius: 8px; background: var(--code-bg); border: 1px solid var(--line); font-family: var(--font-mono); font-size: 12.5px; line-height: 1.65; overflow-x: auto; white-space: pre; }

  .boxes { display: flex; gap: 4px; }
  .boxes i { width: 26px; height: 8px; border-radius: 4px; background: var(--heat-0); }
  .boxes i.on { background: var(--ok); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 13.5px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; }
  .history { width: 100%; border-collapse: collapse; font-size: 13px; }
  .history th, .history td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  .history th { color: var(--muted); font-weight: 500; }
  .history td.mono { font-variant-numeric: tabular-nums; }
  .empty { margin: 0; color: var(--muted); font-size: 13.5px; }

  /* bench */
  .bench { display: grid; min-width: 0; overflow: hidden; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .toolbar .spacer { flex: 1; }
  .hint { font-size: 12px; color: var(--faint); }
  .btn {
    padding: 6px 12px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
    cursor: pointer;
    font-size: 13.5px;
    line-height: 1.4;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 500; }
  .btn.danger { color: var(--bad); border-color: var(--bad); background: var(--bad-soft); }
  .btn.ghost { background: transparent; }
  .editor-host { min-width: 0; }
  /* editor: a native textarea (input, caret, selection) over a highlighted <pre> with the same metrics */
  .ed {
    position: relative;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    height: 440px;
    background: var(--code-bg);
    font-family: var(--font-mono);
    font-size: 13.5px;
    line-height: 1.6;
  }
  @media (max-width: 899px) { .ed { height: 360px; } }
  .ed-gutter, .ed-hl, .ed-input {
    font: inherit;
    line-height: inherit;
    font-variant-ligatures: none;
    font-kerning: none;
    letter-spacing: 0;
    tab-size: 2;
    -webkit-text-size-adjust: none;
    text-size-adjust: none;
  }
  .ed-gutter {
    overflow: hidden;
    margin: 0;
    padding: 10px 10px 60px 12px;
    min-width: 3.4em;
    text-align: right;
    color: var(--faint);
    border-right: 1px solid var(--line);
    white-space: pre;
    user-select: none;
    font-variant-numeric: tabular-nums;
  }
  .ed-main { position: relative; overflow: hidden; min-width: 0; }
  .ed-hl, .ed-input {
    position: absolute;
    inset: 0;
    margin: 0;
    border: 0;
    border-radius: 0;
    white-space: pre;
    overflow-wrap: normal;
    word-break: normal;
  }
  .ed-hl { padding: 10px 60px 60px 12px; overflow: hidden; color: var(--ink); pointer-events: none; }
  .ed-input {
    padding: 10px 12px;
    overflow: auto;
    resize: none;
    background: transparent;
    color: transparent;
    -webkit-text-fill-color: transparent;
    caret-color: var(--ink);
    outline: none;
    box-shadow: none;
    appearance: none;
  }
  .ed-input::selection { background: var(--select); color: transparent; -webkit-text-fill-color: transparent; }
  .ed:focus-within { box-shadow: inset 0 0 0 2px var(--accent-soft); }
  /* syntax colors: same token classes and palette as the 力扣 Hot100 page (VS Code Light+ / Dark+) */
  .tk-k { color: var(--t-k); }
  .tk-k2 { color: var(--t-k2); }
  .tk-s { color: var(--t-s); }
  .tk-n { color: var(--t-n); }
  .tk-c { color: var(--t-c); }
  .tk-f { color: var(--t-f); }
  .tk-v { color: var(--t-v); }
  .tk-t { color: var(--t-t); }

  .results { border-top: 1px solid var(--line); padding: 12px 14px 14px; display: grid; gap: 10px; min-width: 0; }
  .res-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
  .res-head strong { font-size: 14.5px; }
  .res-count { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .res-count .ok { color: var(--ok); }
  .res-count .bad { color: var(--bad); }
  .banner { padding: 10px 12px; border-radius: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 14px; }
  .banner.ok { background: var(--ok-soft); color: var(--ok); }
  .banner.warn { background: var(--warn-soft); color: var(--warn); }
  .banner .spacer { flex: 1; }
  .fatal { margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--bad-soft); color: var(--bad); font-family: var(--font-mono); font-size: 12.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .tests { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .test { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 5px 6px; border-radius: 6px; font-size: 13.5px; }
  .test .icon { font-family: var(--font-mono); font-weight: 600; text-align: center; }
  .test.ok .icon { color: var(--ok); }
  .test.bad { background: var(--bad-soft); }
  .test.bad .icon { color: var(--bad); }
  .test.running .icon { color: var(--accent); }
  .test.pending .icon, .test.skipped .icon { color: var(--faint); }
  .test .tag { font-size: 11px; color: var(--warn); border: 1px solid var(--warn); border-radius: 4px; padding: 0 4px; margin-left: 6px; }
  .test .ms { font-family: var(--font-mono); font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .test .msg { grid-column: 2 / -1; margin: 2px 0 0; font-family: var(--font-mono); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--bad); }
  .console { margin: 0; padding: 8px 10px; border-radius: 8px; background: var(--code-bg); border: 1px solid var(--line); font-family: var(--font-mono); font-size: 12px; max-height: 180px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
  .console .warn { color: var(--warn); }
  .console .error { color: var(--bad); }
  .sub-label { font-size: 12.5px; color: var(--muted); font-weight: 500; }
  .placeholder { margin: 0; color: var(--muted); font-size: 13.5px; }
  .review { display: grid; gap: 8px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .review-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .review-text { margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); white-space: pre-wrap; font-size: 13.5px; line-height: 1.7; }
  .review-note { font-size: 12.5px; color: var(--muted); }

  .toast {

<script type="text/plain" id="solution-debounce">
function debounce(fn, delay, immediate = false) {
  let timer = null
  return function (...args) {
    const callNow = immediate && timer === null // timer 为空 = 新一轮的第一次
    clearTimeout(timer) // 又触发了：取消上一个定时器
    timer = setTimeout(() => {
      timer = null // 一轮结束，下一次调用又算新一轮
      if (!immediate) fn.apply(this, args) // 箭头函数沿用外层的 this
    }, delay)
    if (callNow) fn.apply(this, args)
  }
}

// 时间戳版：第一次立即执行，冷却期内的调用直接忽略
function throttle(fn, delay) {
  let last = 0
  return function (...args) {
    const now = Date.now()
    if (now - last >= delay) {
      last = now
      fn.apply(this, args)
    }
  }
}
</script>

<script type="text/plain" id="solution-promise-all">
function promiseAll(iterable) {
  return new Promise((resolve, reject) => {
    const items = [...iterable] // 不可迭代会在这里抛错 → 自动变成 reject
    const results = new Array(items.length)
    let done = 0

    if (items.length === 0) return resolve(results) // 否则永远 pending

    items.forEach((item, i) => {
      Promise.resolve(item).then((value) => {
        results[i] = value // 按下标放，顺序与输入一致
        done += 1 // 用计数判断完成，不能用 results.length
        if (done === items.length) resolve(results)
      }, reject) // 任意一个失败就整体失败
    })
  })
}

// allSettled：把每一项都变成"一定成功"的 promise，再交给 all
function promiseAllSettled(iterable) {
  return promiseAll(
    [...iterable].map((item) =>
      Promise.resolve(item).then(
        (value) => ({ status: 'fulfilled', value }),
        (reason) => ({ status: 'rejected', reason }),
      ),
    ),
  )
}

// race：谁先落定就跟谁
function promiseRace(iterable) {
  return new Promise((resolve, reject) => {
    for (const item of iterable) Promise.resolve(item).then(resolve, reject)
  })
}
</script>

<script type="text/plain" id="solution-pool">
async function asyncPool(limit, items, iteratee) {
  const results = new Array(items.length)
  let next = 0 // 共享游标：下一个待领取的下标

  async function worker() {
    while (next < items.length) {
      const i = next++ // 判断和领取在同一段同步代码里，不会撞车
      results[i] = await iteratee(items[i], i) // 等它完成再领下一个
    }
  }

  const count = Math.min(limit, items.length)
  await Promise.all(Array.from({ length: count }, worker)) // 所有 worker 收工 = 全部完成
  return results
}

class Scheduler {
  constructor(max) {
    this.max = max
    this.running = 0
    this.queue = []
  }

  add(task) {
    return new Promise((resolve, reject) => {
      // 先把 resolve / reject 存起来，轮到这个任务时再兑现
      this.queue.push({ task, resolve, reject })
      this.run()
    })
  }

  run() {
    while (this.running < this.max && this.queue.length > 0) {
      const { task, resolve, reject } = this.queue.shift()
      this.running += 1
      Promise.resolve()
        .then(task) // task 同步抛错也会变成 rejection
        .then(resolve, reject)
        .finally(() => {
          this.running -= 1 // 必须用 finally：失败也要释放位置
          this.run()
        })
    }
  }
}
</script>

<script type="text/plain" id="starter-deep-clone">
// 深拷贝：对象和数组要逐层复制，并且能处理循环引用

<script type="text/plain" id="solution-deep-clone">
function deepClone(value, seen = new WeakMap()) {
  // 基本类型（包括 null）和函数：直接返回
  if (value === null || typeof value !== 'object') return value

  if (value instanceof Date) return new Date(value)
  if (value instanceof RegExp) return new RegExp(value.source, value.flags)

  // 拷过了：直接复用，循环在这里被截断
  if (seen.has(value)) return seen.get(value)

  if (value instanceof Map) {
    const copy = new Map()
    seen.set(value, copy)
    value.forEach((v, k) => copy.set(deepClone(k, seen), deepClone(v, seen)))
    return copy
  }
  if (value instanceof Set) {
    const copy = new Set()
    seen.set(value, copy)
    value.forEach((v) => copy.add(deepClone(v, seen)))
    return copy
  }

  const copy = Array.isArray(value) ? [] : Object.create(Object.getPrototypeOf(value))
  seen.set(value, copy) // 先登记，再递归
  for (const key of Reflect.ownKeys(value)) {
    copy[key] = deepClone(value[key], seen)
  }
  return copy
}
</script>

<script type="text/plain" id="solution-call-bind">
Function.prototype.myCall = function (context, ...args) {
  if (typeof this !== 'function') throw new TypeError('myCall must be called on a function')
  const ctx = context == null ? globalThis : Object(context) // == null 同时覆盖 null 和 undefined
  const key = Symbol('fn') // 独一无二的临时键
  ctx[key] = this // this 就是要调用的函数
  try {
    return ctx[key](...args) // 方法调用 → 函数里的 this = ctx
  } finally {
    delete ctx[key] // 抛错也会清理
  }
}

Function.prototype.myApply = function (context, args = []) {
  return this.myCall(context, ...args)
}

Function.prototype.myBind = function (context, ...preset) {
  const fn = this
  function bound(...rest) {
    const isNew = this instanceof bound // 是不是被 new 调用
    return fn.apply(isNew ? this : context, [...preset, ...rest])
  }
  // 让 new bound() 的实例能沿原型链找到 fn.prototype（箭头函数没有 prototype）
  if (fn.prototype) bound.prototype = Object.create(fn.prototype)
  return bound
}
</script>

<script type="text/plain" id="solution-emitter">
class EventEmitter {
  constructor() {
    this.events = new Map() // 事件名 → 回调数组
  }

  on(name, fn) {
    if (!this.events.has(name)) this.events.set(name, [])
    this.events.get(name).push(fn)
    return this
  }

  off(name, fn) {
    const list = this.events.get(name)
    if (!list) return this
    if (fn === undefined) {
      this.events.delete(name) // 不传 fn：清空这个事件
      return this
    }
    // f.raw === fn：用原函数也能删掉 once 注册的 wrapper
    const index = list.findIndex((f) => f === fn || f.raw === fn)
    if (index !== -1) list.splice(index, 1)
    return this
  }

  once(name, fn) {
    const wrapper = (...args) => {
      this.off(name, wrapper) // 先删自己，再执行
      fn.apply(this, args)
    }
    wrapper.raw = fn
    return this.on(name, wrapper)
  }

  emit(name, ...args) {
    const list = this.events.get(name)
    if (!list || list.length === 0) return false
    for (const f of [...list]) f.apply(this, args) // 遍历副本
    return true
  }
}
</script>

<script type="text/plain" id="solution-tree">
function arrayToTree(list, rootPid = 0) {
  const map = new Map()
  for (const item of list) {
    map.set(item.id, { ...item, children: [] }) // 第一遍：只建节点，不改入参
  }

  const roots = []
  for (const item of list) {
    const node = map.get(item.id)
    if (item.pid === rootPid) roots.push(node)
    else map.get(item.pid)?.children.push(node) // 第二遍：挂到父节点下；孤儿直接忽略
  }
  return roots
}
</script>

}

<script type="text/plain" id="solution-flat">
function flat(arr, depth = 1) {
  const result = []
  for (const item of arr) {
    // 还能展开：递归，depth 减 1；Infinity - 1 仍是 Infinity
    if (Array.isArray(item) && depth > 0) result.push(...flat(item, depth - 1))
    else result.push(item)
  }
  return result
}

function flattenObject(obj) {
  const result = {}
  const walk = (value, path) => {
    const isContainer = value !== null && typeof value === 'object'
    if (!isContainer || Object.keys(value).length === 0) {
      if (path) result[path] = value // 叶子：基本类型、空对象、空数组
      return
    }
    for (const [key, child] of Object.entries(value)) {
      let next = key
      if (Array.isArray(value)) next = `${path}[${key}]` // 数组下标写成 [i]
      else if (path) next = `${path}.${key}`
      walk(child, next)
    }
  }
  walk(obj, '')
  return result
}
</script>

<script type="text/plain" id="solution-array-api">
Array.prototype.myMap = function (callback, thisArg) {
  const result = new Array(this.length)
  for (let i = 0; i < this.length; i++) {
    if (i in this) result[i] = callback.call(thisArg, this[i], i, this) // i in this：跳过空位
  }
  return result
}

Array.prototype.myFilter = function (callback, thisArg) {
  const result = []
  for (let i = 0; i < this.length; i++) {
    if (i in this && callback.call(thisArg, this[i], i, this)) result.push(this[i])
  }
  return result
}

Array.prototype.myReduce = function (callback, initialValue) {
  let i = 0
  let acc
  if (arguments.length >= 2) {
    acc = initialValue // 传了初始值（哪怕是 undefined）
  } else {
    while (i < this.length && !(i in this)) i++ // 跳过开头的空位
    if (i >= this.length) throw new TypeError('Reduce of empty array with no initial value')
    acc = this[i]
    i++
  }
  for (; i < this.length; i++) {
    if (i in this) acc = callback(acc, this[i], i, this)
  }
  return acc
}

<script type="text/plain" id="solution-big-add">
function addStrings(a, b) {
  let i = a.length - 1
  let j = b.length - 1
  let carry = 0 // 进位
  const digits = []
  while (i >= 0 || j >= 0 || carry > 0) {
    const x = i >= 0 ? Number(a[i]) : 0 // 短的那个走完了就当 0
    const y = j >= 0 ? Number(b[j]) : 0
    const sum = x + y + carry
    digits.push(sum % 10) // 当前位
    carry = Math.floor(sum / 10)
    i--
    j--
  }
  // 进阶：去掉前导 0，至少保留一位
  while (digits.length > 1 && digits[digits.length - 1] === 0) digits.pop()
  return digits.reverse().join('')
}
</script>

  // \B：不是单词边界（不会在开头插）；(?=(\d{3})+$)：这个位置后面到结尾的数字个数是 3 的倍数
  const grouped = intPart.replace(/\B(?=(\d{3})+$)/g, ',')
  return decPart === undefined ? grouped : `${grouped}.${decPart}`
}

// 不用正则：从个位往前数，每满三位且前面还有数字就加逗号
function formatThousandsLoop(num) {
  const [intPart, decPart] = String(num).split('.')
  let out = ''
  let count = 0
  for (let i = intPart.length - 1; i >= 0; i--) {
    out = intPart[i] + out
    count++
    const hasMoreDigits = i > 0 && intPart[i - 1] !== '-'
    if (count % 3 === 0 && hasMoreDigits) out = ',' + out
  }
  return decPart === undefined ? out : `${out}.${decPart}`
}
</script>

<script type="text/plain" id="solution-parse-query">
function parseQuery(url) {
  const query = url.split('#')[0].split('?')[1] ?? '' // 先去掉 # 后面，再取 ? 后面
  const result = {}
  for (const pair of query.split('&')) {
    if (!pair) continue // 忽略空的 &&
    const eq = pair.indexOf('=') // 按第一个 = 拆，值里可能还有 =
    const decode = (s) => decodeURIComponent(s.replace(/\+/g, ' ')) // + 表示空格
    const key = decode(eq === -1 ? pair : pair.slice(0, eq))
    const value = eq === -1 ? true : decode(pair.slice(eq + 1))
    if (Object.hasOwn(result, key)) result[key] = [].concat(result[key], value) // 同名参数转数组
    else result[key] = value
  }
  return result
}

<script type="text/plain" id="solution-async-add">
function asyncAdd(a, b, callback) {
  setTimeout(() => callback(null, a + b), 50)
}

// 先把回调风格包成返回 Promise 的函数
const addAsync = (a, b) =>
  new Promise((resolve, reject) => {
    asyncAdd(a, b, (err, sum) => (err ? reject(err) : resolve(sum)))
  })

async function sumSerial(...nums) {
  if (nums.length === 0) return 0
  let total = nums[0]
  for (let i = 1; i < nums.length; i++) total = await addAsync(total, nums[i]) // 一次等一个
  return total
}

async function sumParallel(...nums) {
  if (nums.length <= 1) return nums[0] ?? 0
  const round = []
  for (let i = 0; i < nums.length; i += 2) {
    // 两两一组同时开始；落单的直接进下一轮
    round.push(i + 1 < nums.length ? addAsync(nums[i], nums[i + 1]) : nums[i])
  }
  return sumParallel(...(await Promise.all(round))) // 这一轮的结果再两两相加
}

function promisify(fn) {
  return (...args) =>
    new Promise((resolve, reject) => {
      fn(...args, (err, value) => (err ? reject(err) : resolve(value)))
    })
}
</script>

<script type="text/plain" id="solution-is-equal">
function isEqual(a, b, seen = new WeakMap()) {
  // 同一个引用、相等的基本类型、两个 NaN
  if (a === b || (Number.isNaN(a) && Number.isNaN(b))) return true
  // 排除 null，并且两个都得是对象
  const bothObjects = a !== null && b !== null && typeof a === 'object' && typeof b === 'object'
  if (!bothObjects) return false
  // 进阶：Date 没有自有键，要按时间比
  if (a instanceof Date || b instanceof Date) {
    return a instanceof Date && b instanceof Date && a.getTime() === b.getTime()
  }
  if (Array.isArray(a) !== Array.isArray(b)) return false // 数组和对象不相等
  // 进阶：循环引用，这一对已经在比较中了，直接当作相等
  if (seen.get(a) === b) return true
  seen.set(a, b)
  const keysA = Object.keys(a)
  const keysB = Object.keys(b)
  if (keysA.length !== keysB.length) return false
  return keysA.every((key) => Object.hasOwn(b, key) && isEqual(a[key], b[key], seen))
}
</script>

<script type="text/plain" id="solution-shuffle">
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1)); // 在 [0, i] 里随机选一个（包含 i）
    [arr[i], arr[j]] = [arr[j], arr[i]] // 换到第 i 位；上一行的分号不能省
  }
  return arr
}

<script type="text/plain" id="solution-ajax">
function request({ method = 'GET', url, data, headers = {}, timeout = 0 }) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest()
    xhr.open(method, url, true) // 第三个参数 true：异步
    // 请求头要在 open 之后、send 之前设置
    for (const [key, value] of Object.entries(headers)) xhr.setRequestHeader(key, value)
    if (data !== undefined) xhr.setRequestHeader('Content-Type', 'application/json')
    xhr.timeout = timeout // 0 表示不限时
    xhr.onreadystatechange = () => {
      if (xhr.readyState !== 4) return // 4 = 请求完成
      if (xhr.status >= 200 && xhr.status < 300) resolve(xhr.responseText)
      else if (xhr.status !== 0) reject(new Error(`Request failed with status ${xhr.status}`))
      // status 为 0：网络错误或超时，交给下面的 onerror / ontimeout
    }
    xhr.onerror = () => reject(new Error('Network error'))
    xhr.ontimeout = () => reject(new Error(`Timeout after ${timeout}ms`))
    xhr.send(data === undefined ? null : JSON.stringify(data))
  })
}
</script>

  /* ======================= worker (runs user code in isolation) ======================= */
  function workerMain() {

    if (typeof self.addEventListener === 'function') {

    const fmt = (value, depth = 0) => {
      if (typeof value === 'string') return depth === 0 ? JSON.stringify(value) : JSON.stringify(value)
      if (typeof value === 'function') return `ƒ ${value.name || '(anonymous)'}`
      if (typeof value === 'symbol') return value.toString()
      if (typeof value === 'bigint') return `${value}n`
      if (value === undefined) return 'undefined'
      if (value === null || typeof value !== 'object') return String(value)
      if (depth > 3) return Array.isArray(value) ? '[…]' : '{…}'
      if (value instanceof Error) return `${value.name}: ${value.message}`
      if (value instanceof Date) return `Date(${value.toISOString()})`
      if (value instanceof RegExp) return String(value)
      if (value instanceof Map) return `Map(${value.size}) {${[...value].map(([k, v]) => `${fmt(k, depth + 1)} => ${fmt(v, depth + 1)}`).join(', ')}}`
      if (value instanceof Set) return `Set(${value.size}) {${[...value].map((v) => fmt(v, depth + 1)).join(', ')}}`
      if (typeof value.then === 'function') return 'Promise {…}'
      if (Array.isArray(value)) return `[${value.map((v) => fmt(v, depth + 1)).join(', ')}]`
      const keys = Object.keys(value)
      return `{ ${keys.map((k) => `${k}: ${fmt(value[k], depth + 1)}`).join(', ')}${keys.length ? ' ' : ''}}`
    }

    for (const level of ['log', 'info', 'warn', 'error', 'debug']) {
      console[level] = (...args) => send({ type: 'log', level, text: args.map((a) => (typeof a === 'string' ? a : fmt(a))).join(' ') })

    const deepEqual = (a, b) => {
      if (Object.is(a, b)) return true
      if (typeof a !== 'object' || typeof b !== 'object' || a === null || b === null) return false
      if (Array.isArray(a) !== Array.isArray(b)) return false
      if (Object.getPrototypeOf(a) !== Object.getPrototypeOf(b) && !(isPlain(a) && isPlain(b))) return false
      const ka = Object.keys(a)
      const kb = Object.keys(b)
      if (ka.length !== kb.length) return false
      return ka.every((k) => Object.prototype.hasOwnProperty.call(b, k) && deepEqual(a[k], b[k]))

    const isPlain = (v) => {
      const proto = Object.getPrototypeOf(v)

    const helpers = {
      sleep: (ms) => new Promise((resolve) => setTimeout(resolve, ms)),
      delay: (value, ms, fail = false) => new Promise((resolve, reject) => setTimeout(() => (fail ? reject(value) : resolve(value)), ms)),
      eq(actual, expected, msg = '结果不对') {

      ok(condition, msg = '条件不成立') {

      },
      fail(msg) {
        throw new AssertError(msg)
      },
      throws(fn, Type, msg = '应该抛出错误，但没有') {
        try {
          fn()
        } catch (err) {
          if (Type && !(err instanceof Type)) throw new AssertError(`${msg}\n  实际抛出的是：${fmt(err)}`)
          return err
        }
        throw new AssertError(msg)
      },
      async rejects(promise, msg) {
        if (!promise || typeof promise.then !== 'function') {

        }
        try {
          await promise
        } catch (err) {
          return err
        }
        throw new AssertError(msg || '这个 Promise 应该 reject，但它 resolve 了')
      },
      timeout(promise, ms, msg) {
        return Promise.race([
          promise,
          new Promise((_, reject) => setTimeout(() => reject(new AssertError(msg || `${ms}ms 内没有完成`)), ms)),
        ])
      },
      async withFakeXHR(behavior, run) {
        const calls = []
        class FakeXHR {
          constructor() {
            Object.assign(this, { readyState: 0, status: 0, statusText: '', responseText: '', response: '', timeout: 0, requestHeaders: {}, listeners: {}, sent: false, done: false })
            calls.push(this)
          }
          open(method, url, async = true) {
            this.method = String(method).toUpperCase()

            this.async = async
            this.readyState = 1

            this.requestHeaders[String(key).toLowerCase()] = value
          }
          addEventListener(type, fn) {
            (this.listeners[type] = this.listeners[type] || []).push(fn)
          }
          removeEventListener(type, fn) {
            this.listeners[type] = (this.listeners[type] || []).filter((f) => f !== fn)
          }
          fire(type) {
            const event = { type, target: this }
            if (typeof this[`on${type}`] === 'function') this[`on${type}`](event)
            for (const fn of this.listeners[type] || []) fn.call(this, event)

            this.readyState = 4
            this.fire('readystatechange')
            this.fire(type)
            this.fire('loadend')

            this.statusText = statusText
            this.responseText = body
            this.response = body

            clearTimeout(this.timer)
          }

        try {
          return await run(calls)
        } finally {

        }

      const m = String((err && err.stack) || '').match(/solution\.js:(\d+):(\d+)/)
      return m ? Math.max(1, Number(m[1]) - 2) : null
    }
    const describe = (err) => {
      if (err instanceof AssertError) return err.message
      const name = (err && err.name) || 'Error'
      const message = err && err.message !== undefined ? err.message : String(err)
      let text = `${name}: ${message}`
      if (/is not a (function|constructor)|Cannot read propert/.test(message)) text += '\n  （检查函数或方法是否已经实现、名字是否写对、有没有 return）'

        } catch (err) {

            type: 'result',
            index: i,
            ok: false,
            ms: Math.round(performance.now() - started),
            message: describe(err),
            line: err instanceof AssertError ? null : userLine(err),

        }

  /* ===== 每日计划 开始：主页、手撕练习场、力扣 Hot100 三个页面里各有一份，内容完全相同，改的时候三处一起改 =====
     每天的题量存在 localStorage 的 study:quota（{ hs: 手撕题道数, lc: 力扣题道数 }），三个页面共用。
     当天第一次打开任意一个页面时定下清单：先排到期的（过期最久的在前），再排新题（按题目顺序），还不够就用最久没练的补齐。

  const DailyPlan = (() => {
    const QUOTA_KEY = 'study:quota'
    const HS_DAYS_KEY = 'hs:days'
    const DEFAULT_QUOTA = { hs: 3, lc: 30 } // 和合并前一样：手撕每天 3 道，力扣每天 30 题
    const MAX_QUOTA = { hs: 20, lc: 100 }
    const KEEP_DAYS = 90

    const read = (key) => {
      try {
        return JSON.parse(localStorage.getItem(key) ?? 'null')
      } catch {
        return null
      }
    }
    const write = (key, value) => {
      try {
        localStorage.setItem(key, JSON.stringify(value))

      } catch {

    const pad2 = (n) => String(n).padStart(2, '0')

    const parseDay = (t) => {
      const [y, m, d] = t.split('-').map(Number)
      return new Date(y, m - 1, d)
    }
    const addDays = (t, n) => {
      const d = parseDay(t)

      if (n === 1) rel = '（明天）'
      else if (n === 2) rel = '（后天）'
      else if (n > 0) rel = `（${n} 天后）`

      // 合并前手撕练习场自己存过"每天几道新题"，第一次用这个值当手撕的题量
      const legacyHs = clampQuota('hs', (read('hs:meta') || {}).target, DEFAULT_QUOTA.hs) || DEFAULT_QUOTA.hs
