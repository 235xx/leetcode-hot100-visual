    // 把当天的清单调整到 n 道：不够就按候选顺序往后补，多了就从末尾去掉还没做的题
    function fit(day, n, candidates, isDone) {
      let changed = false
      if (day.list.length < n) {
        for (const [id, why] of candidates()) {
          if (day.list.length >= n) break
          if (day.list.includes(id)) continue
          day.list.push(id)
          day.why[id] = why
          changed = true
        }
      }
      for (let i = day.list.length - 1; i >= 0 && day.list.length > n; i--) {
        const id = day.list[i]
        if (isDone(id)) continue
        day.list.splice(i, 1)
        delete day.why[id]
        changed = true
      }
      return changed
    }

    /* ---- 力扣：卡片 { interval, reps, lapses, last, due, grade }，lc-srs = { cards, days } ---- */
    function lcCandidates(srs, ids, t) {
      const card = (id) => srs.cards[id]
      const due = []
      const fresh = []
      const rest = []
      for (const id of ids) {
        const c = card(id)
        if (!c) fresh.push(id)
        else if (c.due <= t) due.push(id)
        else rest.push(id)
      }
      due.sort((a, b) => card(a).due.localeCompare(card(b).due) || (card(b).lapses || 0) - (card(a).lapses || 0))
      rest.sort((a, b) => card(a).last.localeCompare(card(b).last) || card(a).due.localeCompare(card(b).due))
      const dueWhy = (c) => (c.due < t ? `到期（晚了 ${dayDiff(c.due, t)} 天）` : '今天到期')
      return [
        ...due.map((id) => [id, ['due', dueWhy(card(id))]]),
        ...fresh.map((id) => [id, ['new', '新题']]),
        ...rest.map((id) => [id, ['fill', `补齐 · 上次 ${ago(card(id).last, t)}，原定 ${fmtDay(card(id).due, t)}`]]),
      ]
    }
    // 返回 { day, changed }；changed 为 true 时由调用方保存 srs
    function lcDay(srs, ids, t, n) {
      let changed = false
      let day = srs.days[t]
      if (!day || !Array.isArray(day.list)) {
        day = { list: [], why: {}, done: {}, extra: {} }
        srs.days[t] = day
        changed = true
      }
      day.why = day.why || {}
      day.done = day.done || {}
      day.extra = day.extra || {}
      const known = new Set(ids)
      const kept = day.list.filter((id) => known.has(id) || day.done[id])
      if (kept.length !== day.list.length) {
        day.list = kept
        changed = true
      }
      if (fit(day, n, () => lcCandidates(srs, ids, t), (id) => Boolean(day.done[id]))) changed = true
      return { day, changed }
    }
    function lcRead() {
      const raw = read('lc-srs')
      return raw && typeof raw === 'object' ? { cards: raw.cards || {}, days: raw.days || {} } : { cards: {}, days: {} }
    }
    function lcWrite(srs) {
      return write('lc-srs', { cards: srs.cards, days: keepRecent(srs.days) })
    }

    /* ---- 手撕：记录 { box, due, best, code, history: [{ day, result, ... }] }，hs:records = { id: 记录 } ---- */
    const hsLast = (rec) => {
      const h = rec && Array.isArray(rec.history) ? rec.history : []
      return h.length > 0 ? h[h.length - 1].day : ''
    }
    const hsDoneOn = (rec, t) => Boolean(rec && Array.isArray(rec.history) && rec.history.some((h) => h.day === t))
    function hsCandidates(records, ids, t) {
      const due = []
      const fresh = []
      const rest = []
      for (const id of ids) {
        const rec = records[id]
        if (!hsLast(rec)) fresh.push(id)
        else if (rec.due && rec.due <= t) due.push(id)
        else rest.push(id)
      }
      due.sort((a, b) => records[a].due.localeCompare(records[b].due))
      rest.sort((a, b) => hsLast(records[a]).localeCompare(hsLast(records[b])))
      const dueWhy = (rec) => (rec.due < t ? `到期（晚了 ${dayDiff(rec.due, t)} 天）` : '今天到期')
      return [
        ...due.map((id) => [id, ['due', dueWhy(records[id])]]),
        ...fresh.map((id) => [id, ['new', '新题']]),
        ...rest.map((id) => [id, ['fill', `巩固 · 上次 ${ago(hsLast(records[id]), t)}`]]),
      ]
    }
    // 返回当天的清单 { list, why }，有变化时直接写回 hs:days
    function hsDay(records, ids, t, n) {
      const days = read(HS_DAYS_KEY) || {}
      let changed = false
      let day = days[t]
      if (!day || !Array.isArray(day.list)) {
        day = { list: [], why: {} }
        days[t] = day
        changed = true
      }
      day.why = day.why || {}
      const known = new Set(ids)
      const kept = day.list.filter((id) => known.has(id))
      if (kept.length !== day.list.length) {
        day.list = kept
        changed = true
      }
      if (fit(day, n, () => hsCandidates(records, ids, t), (id) => hsDoneOn(records[id], t))) changed = true
      if (changed) write(HS_DAYS_KEY, keepRecent(days))
      return day
    }
    const hsReadDays = () => read(HS_DAYS_KEY) || {}

    return { QUOTA_KEY, HS_DAYS_KEY, MAX_QUOTA, read, write, ymd, parseDay, addDays, dayDiff, quota, setQuota, lcDay, lcRead, lcWrite, hsDay, hsDoneOn, hsReadDays }
  })()
  /* ===== 每日计划 结束 ===== */

  let toastTimer = 0
  function toast(text) {
    const el = $('#toast')
    el.textContent = text
    el.hidden = false
    clearTimeout(toastTimer)
    toastTimer = setTimeout(() => { el.hidden = true }, 3200)
  }

  /* ======================= state ======================= */
  const state = {
    current: QUESTIONS[0].id,
    tab: ls.get('hs:tab', 'task'),
    records: ls.get('hs:records', {}),
    meta: { target: 3, ...ls.get('hs:meta', {}) },
    attempts: {},
    runs: {},
    reviews: {},
    revealArmed: false,
    resetArmed: false,
    sync: 'connecting',
  }
  for (const id of Object.keys(state.records)) if (!QUESTION_IDS.has(id)) delete state.records[id]

  /* ======================= persistence (db when available, else this browser) ======================= */
  const store = { col: null, chains: {} }

  function cacheLocal() {
    ls.set('hs:records', state.records)
    ls.set('hs:meta', state.meta)
  }

  function enqueueWrite(docId, body) {
    if (!store.col) return
    const prev = store.chains[docId] || Promise.resolve()
    store.chains[docId] = prev
      .then(() => store.col.doc(docId).set(body))
      .catch((err) => {
        const code = err && err.code
        if (code === 'quota_exceeded') toast('存储空间已满，这次记录只保存在本浏览器。')
        else if (code === 'revoked' || code === 'not_granted' || code === 'invalid_argument') {
          store.col = null
          setSync('local')
          toast('没法写入你的账号，记录改为保存在本浏览器。')
        } else toast('同步失败，记录已暂存在本浏览器，下次操作时会再试。')
      })
  }

  function persistRecord(qid) {
    cacheLocal()
    enqueueWrite(qid, clone(state.records[qid]))
  }

  function setSync(mode) {
    state.sync = mode
    const el = $('#sync')
    el.dataset.mode = mode
    el.textContent = {
      connecting: '正在连接你的账号…',
      db: '进度已同步到你的 Claude 账号',
      local: '进度只保存在这个浏览器',
      error: '同步出错，进度暂存在这个浏览器',
    }[mode]
  }

  async function initStore() {
    const [db, user] = await Promise.all([use('db'), use('user')])
    if (!db || !user) return setSync('local')
    const uid = await user.id()
    if (!uid) return setSync('local')
    let col
    try {
      col = db.collection(`data/users/${uid}`)
    } catch {
      return setSync('local')
    }
    try {
      const first = await col.get()
      store.col = col
      if (first.empty && Object.keys(state.records).length > 0) {
        // first visit with this account: carry over what this browser already has
        for (const qid of Object.keys(state.records)) enqueueWrite(qid, clone(state.records[qid]))
        enqueueWrite('meta', clone(state.meta))
      }
    } catch {
      return setSync('error')
    }
    col.onSnapshot(
      (snap) => {
        const records = {}
        let meta = null
        for (const doc of snap.docs) {
          if (!doc.exists) continue
          if (doc.id === 'meta') meta = doc.data()
          else if (QUESTION_IDS.has(doc.id)) records[doc.id] = clone(doc.data())
        }
        if (snap.empty && Object.keys(state.records).length > 0) return
        state.records = records
        if (meta) state.meta = { target: 3, ...clone(meta) }
        cacheLocal()
        setSync('db')
        renderChrome()
        if (state.tab === 'record') renderTab()
      },
      () => setSync('error'),
    )
    setSync('db')
  }

  /* ======================= derived ======================= */
  function statusOf(qid) {
    const rec = state.records[qid]
    const t = todayKey()
    if (!rec || !Array.isArray(rec.history) || rec.history.length === 0) return { key: 'new', label: '新题' }
    if (rec.history.some((h) => h.day === t)) return { key: 'today', label: '今日已练' }
    if (rec.due && rec.due <= t) return { key: 'due', label: '待复习' }
    if ((rec.box || 0) >= MASTERED_BOX) return { key: 'mastered', label: '已掌握' }
    return { key: 'learning', label: '学习中' }
  }

  const REASON = { due: '复习', new: '新题', fill: '巩固' }

  function todayPlan() {
    const t = todayKey()
    const day = DailyPlan.hsDay(state.records, QUESTIONS.map((q) => q.id), t, DailyPlan.quota().hs)
    return day.list
      .filter((id) => QUESTION_IDS.has(id))
      .map((id) => {
        const [kind, detail] = day.why[id] || ['fill', '']
        const done = statusOf(id).key === 'today'
        return { id, done, kind, reason: REASON[kind] || '巩固', detail: kind === 'new' ? `建议 ${qById(id).minutes} 分钟` : detail }
      })
  }

  function practiceCounts() {
    const counts = new Map()
    for (const rec of Object.values(state.records)) {
      for (const h of rec.history || []) counts.set(h.day, (counts.get(h.day) || 0) + 1)
    }
    return counts
  }

  function streakDays(counts) {
    let day = todayKey()
    if (!counts.has(day)) day = addDays(day, -1)
    let n = 0
    while (counts.has(day)) {
      n += 1
      day = addDays(day, -1)
    }
    return n
  }

  /* ======================= attempts ======================= */
  function attemptFor(qid) {
    if (!state.attempts[qid]) state.attempts[qid] = { startedAt: Date.now(), viewedAnswer: false, done: false }
    return state.attempts[qid]
  }

  function completeAttempt(qid, code) {
    const attempt = attemptFor(qid)
    if (attempt.done) return null
    const ms = Date.now() - attempt.startedAt
    const t = todayKey()
    const prev = state.records[qid] || { box: 0, history: [] }
    const history = Array.isArray(prev.history) ? prev.history : []
    const alreadyToday = history.some((h) => h.day === t)
    const assisted = attempt.viewedAnswer
    let box = prev.box || 0
    if (assisted) box = 0
    else if (!alreadyToday) box = Math.min(box + 1, MAX_BOX)
    const due = assisted || !alreadyToday || !prev.due ? addDays(t, INTERVALS[box]) : prev.due
    const best = assisted ? prev.best ?? null : Math.min(prev.best ?? Infinity, ms)
    state.records[qid] = {
      box,
      due,
      best: Number.isFinite(best) ? best : null,
      code,
      history: [...history, { at: new Date().toISOString(), day: t, ms, result: assisted ? 'assisted' : 'pass' }].slice(-HISTORY_LIMIT),
    }
    Object.assign(attempt, { done: true, ms, assisted, again: alreadyToday })
    persistRecord(qid)
    return attempt
  }

  /* ======================= editor ======================= */
  let suppressChange = false
  let draftTimer = 0
  let loadedQid = null

  function createEditor(host, { onChange, onRun }) {
    host.innerHTML = `
      <div class="ed">
        <pre class="ed-gutter" aria-hidden="true"></pre>
        <div class="ed-main">
          <pre class="ed-hl" aria-hidden="true"></pre>
          <textarea class="ed-input" id="code-input" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" aria-label="代码编辑器"></textarea>
        </div>
      </div>`
    const ta = $('.ed-input', host)
    const hl = $('.ed-hl', host)
    const gutter = $('.ed-gutter', host)
    const PAIRS = { '(': ')', '[': ']', '{': '}', "'": "'", '"': '"', '`': '`' }
    const QUOTES = new Set(["'", '"', '`'])
    const CLOSERS = new Set([')', ']', '}'])
    const INDENT = '  '
    let lineCount = 0

    const syncScroll = () => {
      hl.scrollTop = ta.scrollTop
      hl.scrollLeft = ta.scrollLeft
      gutter.scrollTop = ta.scrollTop
    }
    const render = () => {
      // the trailing space keeps the overlay as tall as the textarea when the code ends with a newline
      hl.innerHTML = `${highlightCode(ta.value)}\n `
      const lines = ta.value.split('\n').length
      if (lines !== lineCount) {
        lineCount = lines
        gutter.textContent = `${Array.from({ length: lines }, (_, i) => i + 1).join('\n')}\n `
      }
      syncScroll()
    }
    const lineStartOf = (text, pos) => text.lastIndexOf('\n', pos - 1) + 1

    // Replace [start, end) with text; execCommand keeps the browser's own undo history
    const edit = (start, end, text, caretStart, caretEnd = caretStart) => {
      ta.focus()
      ta.setSelectionRange(start, end)
      let ok = false
      try {
        ok = document.execCommand('insertText', false, text)
      } catch {
        ok = false
      }
      if (!ok) ta.setRangeText(text, start, end, 'end')
      ta.setSelectionRange(caretStart, caretEnd)
      render()
      onChange(ta.value)
    }

    const selectedLines = () => {
      const { selectionStart: s, selectionEnd: e, value } = ta
      let end = e
      if (end > s && value[end - 1] === '\n') end -= 1
      const lineEnd = value.indexOf('\n', end)
      return { start: lineStartOf(value, s), end: lineEnd === -1 ? value.length : lineEnd }
    }
    const indent = () => {
      const { selectionStart: s, selectionEnd: e, value } = ta
      if (!value.slice(s, e).includes('\n')) return edit(s, e, INDENT, s + INDENT.length)
      const { start, end } = selectedLines()
      const out = value.slice(start, end).split('\n').map((l) => (l ? INDENT + l : l)).join('\n')
      return edit(start, end, out, start, start + out.length)
    }
    const outdent = () => {
      const { start, end } = selectedLines()
      const block = ta.value.slice(start, end)
      const out = block.split('\n').map((l) => l.replace(/^ {1,2}/, '')).join('\n')
      if (out !== block) edit(start, end, out, start, start + out.length)
    }
    const toggleComment = () => {
      const { start, end } = selectedLines()
      const lines = ta.value.slice(start, end).split('\n')
      const filled = lines.filter((l) => l.trim())
      if (!filled.length) return
      const commented = filled.every((l) => /^\s*\/\//.test(l))
      const minIndent = Math.min(...filled.map((l) => l.match(/^\s*/)[0].length))
      const out = lines.map((l) => {
        if (!l.trim()) return l
        if (commented) return l.replace(/^(\s*)\/\/ ?/, '$1')
        return `${l.slice(0, minIndent)}// ${l.slice(minIndent)}`
      }).join('\n')
      edit(start, end, out, start, start + out.length)
    }
    const newline = () => {
      const { selectionStart: s, selectionEnd: e, value } = ta
      const lead = value.slice(lineStartOf(value, s), s).match(/^\s*/)[0]
      const before = value[s - 1] || ''
      const opens = before !== '' && '([{'.includes(before)
      if (opens && value[e] === PAIRS[before]) {
        const inner = `\n${lead}${INDENT}`
        return edit(s, e, `${inner}\n${lead}`, s + inner.length)
      }
      const text = `\n${lead}${opens ? INDENT : ''}`
      return edit(s, e, text, s + text.length)
    }

    ta.addEventListener('keydown', (e) => {
      if (e.isComposing || e.keyCode === 229) return
      const { selectionStart: s, selectionEnd: end, value } = ta
      const mod = e.metaKey || e.ctrlKey
      if (mod && e.key === 'Enter') {
        e.preventDefault()
        onRun()
        return
      }
      if (mod && e.key === '/') {
        e.preventDefault()
        toggleComment()
        return
      }
      if (e.key === 'Tab') {
        e.preventDefault()
        if (e.shiftKey) outdent()
        else indent()
        return
      }
      if (e.key === 'Enter' && !mod && !e.altKey && !e.shiftKey) {
        e.preventDefault()
        newline()
        return
      }
      if (e.key === 'Backspace' && !mod && s === end && s > 0) {
        if (PAIRS[value[s - 1]] && PAIRS[value[s - 1]] === value[s]) {
          e.preventDefault()
          edit(s - 1, s + 1, '', s - 1)
          return
        }
        const head = value.slice(lineStartOf(value, s), s)
        if (head.length >= 2 && /^ +$/.test(head)) {
          e.preventDefault()
          const cut = head.length % 2 === 0 ? 2 : 1
          edit(s - cut, s, '', s - cut)
        }
        return
      }
      if (mod || e.altKey || e.key.length !== 1) return
      if ((CLOSERS.has(e.key) || QUOTES.has(e.key)) && s === end && value[s] === e.key) {
        e.preventDefault()
        ta.setSelectionRange(s + 1, s + 1)
        return
      }
      if (PAIRS[e.key]) {
        if (s !== end) {
          e.preventDefault()
          edit(s, end, `${e.key}${value.slice(s, end)}${PAIRS[e.key]}`, s + 1, end + 1)
          return
        }
        if (QUOTES.has(e.key) && /\w/.test(value[s - 1] || '')) return
        const next = value[s] || ''
        if (next === '' || /[\s)\]};,]/.test(next)) {
          e.preventDefault()
          edit(s, s, `${e.key}${PAIRS[e.key]}`, s + 1)
        }
      }
    })
    ta.addEventListener('input', () => {
      render()
      onChange(ta.value)
    })
    ta.addEventListener('scroll', syncScroll)

    return {
      get: () => ta.value,
      set(value) {
        ta.value = value
        ta.setSelectionRange(0, 0)
        ta.scrollTop = 0
        ta.scrollLeft = 0
        render()
      },
      focus: () => ta.focus(),
      jump(line) {
        const pos = ta.value.split('\n').slice(0, Math.max(0, line - 1)).reduce((n, l) => n + l.length + 1, 0)
        ta.focus()
        ta.setSelectionRange(pos, pos)
        const lh = parseFloat(getComputedStyle(ta).lineHeight) || 21.6
        ta.scrollTop = Math.max(0, (line - 4) * lh)
        syncScroll()
      },
    }
  }

  const editor = createEditor($('#editor'), {
    onChange(value) {
      if (suppressChange) return
      clearTimeout(draftTimer)
      const qid = loadedQid
      if (!qid) return
      draftTimer = setTimeout(() => ls.set(`hs:draft:${qid}`, value), 400)
    },
    onRun: () => runTests(),
  })

  function loadCode(qid) {
    const draft = ls.get(`hs:draft:${qid}`, null)
    const rec = state.records[qid]
    const code = typeof draft === 'string' ? draft : rec && typeof rec.code === 'string' ? rec.code : sourceOf('starter', qid)
    suppressChange = true
    editor.set(code)
    suppressChange = false
    loadedQid = qid
  }

  function flushDraft() {
    clearTimeout(draftTimer)
    if (loadedQid) ls.set(`hs:draft:${loadedQid}`, editor.get())
  }

  /* ======================= runner ======================= */
  let running = false

  let probingSyntax = false
  window.addEventListener('error', (event) => {
    if (probingSyntax) return
    toast(`页面出错：${event.message || '未知错误'}。截图发给 Claude 可以帮你排查。`)
  })

  function locateSyntaxError(code) {
    probingSyntax = true
    let line = null
    const onError = (ev) => {
      if (typeof ev.lineno === 'number' && ev.lineno > 0) line = ev.lineno - 1
      ev.preventDefault()
    }
    window.addEventListener('error', onError)
    try {
      const s = document.createElement('script')
      s.textContent = `void function () { return\n${code}\n}`
      document.head.append(s)
      s.remove()
    } catch {
      // ignore: line stays unknown
    }
    window.removeEventListener('error', onError)
    probingSyntax = false
    // some browsers report the line within the whole document; only trust a line inside the user's code
    const total = code.split('\n').length
    return line !== null && line >= 1 && line <= total ? line : null
  }

  function runTests() {
    if (running) return
    const q = qById(state.current)
    const code = editor.get()
    flushDraft()
    attemptFor(q.id)
    const run = {
      status: 'running',
      tests: q.tests.map((t) => ({ name: t.name, bonus: Boolean(t.bonus), state: 'pending' })),
      logs: [],
      fatal: null,
    }
    state.runs[q.id] = run
    state.reviews[q.id] = null
    running = true
    renderResults()

    let worker
    let url
    try {
      url = URL.createObjectURL(new Blob([WORKER_SOURCE], { type: 'text/javascript' }))
      worker = new Worker(url)
    } catch {
      run.status = 'done'
      run.fatal = { message: '浏览器不允许创建 Worker，没法运行测试。', line: null }
      running = false
      renderResults()
      return
    }

    let watchdog = 0
    let currentIndex = -1
    const arm = (ms) => {
      clearTimeout(watchdog)
      watchdog = setTimeout(onHang, ms)
    }
    const finish = () => {
      clearTimeout(watchdog)
      worker.terminate()
      URL.revokeObjectURL(url)
      running = false
      run.status = 'done'
      for (const t of run.tests) if (t.state === 'pending' || t.state === 'running') t.state = 'skipped'
      const main = run.tests.filter((t) => !t.bonus)
      if (!run.fatal && main.length > 0 && main.every((t) => t.state === 'ok')) completeAttempt(q.id, code)
      renderChrome()
      if (q.id === state.current) {
        renderResults()
        if (state.tab === 'record' || state.tab === 'answer') renderTab()
      }
    }
    function onHang() {
      const t = run.tests[currentIndex]
      if (t) {
        t.state = 'bad'
        t.message = '超时：代码一直没有结束，可能有死循环（比如 while 的条件永远成立）。'
      } else {
        run.fatal = { message: '代码加载时一直没有结束，可能有死循环。', line: null }
      }
      finish()
    }

    worker.onmessage = (event) => {
      const msg = event.data
      if (msg.type === 'log') {
        if (run.logs.length < LOG_LIMIT) run.logs.push({ level: msg.level, text: msg.text })
        else if (run.logs.length === LOG_LIMIT) run.logs.push({ level: 'warn', text: `…输出太多，只显示前 ${LOG_LIMIT} 条` })
        return
      }
      if (msg.type === 'fatal') {
        const line = msg.kind === 'syntax' ? locateSyntaxError(code) : msg.line
        run.fatal = { message: msg.message, line, kind: msg.kind }
      } else if (msg.type === 'start') {
        currentIndex = msg.index
        run.tests[msg.index].state = 'running'
        arm(msg.timeout + 1500)
      } else if (msg.type === 'result') {
        Object.assign(run.tests[msg.index], { state: msg.ok ? 'ok' : 'bad', ms: msg.ms, message: msg.message, line: msg.line })
        arm(4000)
      } else if (msg.type === 'done') {
        finish()
        return
      }
      if (q.id === state.current) renderResults()
    }
    worker.onerror = (event) => {
      event.preventDefault()
      run.fatal = { message: event.message || '运行出错', line: null }
      finish()
    }

    arm(4000)
    worker.postMessage({
      code,
      exports: q.exports,
      tests: q.tests.map((t) => ({ src: t.run.toString(), timeout: t.timeout || DEFAULT_TIMEOUT })),
    })
  }

  /* ======================= Claude review (sample capability) ======================= */
  let sampleFn = null
  const REVIEW_ERRORS = {
    rate_limited: '请求太频繁，或者用量已到上限，稍后再试。',
    session_expired: '登录已过期，请重新登录 claude.ai 后再试。',
    refused: 'Claude 没有回答这次请求，改一改代码再试。',
    prompt_too_large: '代码太长了，删掉一些注释再试。',
    empty_completion: 'Claude 这次没有给出内容，再试一次。',
  }
  const REVIEW_HIDE = new Set(['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'])

  function plainText(html) {
    const div = document.createElement('div')
    div.innerHTML = html
    return div.textContent.replace(/\n\s+/g, '\n').trim()
  }

  async function startReview() {
    const q = qById(state.current)
    const run = state.runs[q.id]
    if (!sampleFn || !run || run.status !== 'done') return
    const code = editor.get()
    const lines = run.fatal
      ? [`代码没能运行：${run.fatal.message}`]
      : run.tests.map((t) => `${t.state === 'ok' ? '通过' : '失败'}${t.bonus ? '（进阶）' : ''}：${t.name}${t.message ? `\n    ${t.message.split('\n').join('\n    ')}` : ''}`)
    const prompt = [
      `你是前端面试官，正在看候选人手写的「${q.title}」。请用简体中文点评，总共不超过 300 字，严格按下面三段输出，每段 1 到 3 条短句：`,
      '【结论】能不能过这道面试题，一句话说明。',
      '【问题】指出具体的 bug 或漏掉的边界情况，说明在哪一行、为什么错。没有问题就写"没有明显问题"。',
      '【建议】怎么改写得更好，或者面试官接下来可能追问什么。',
      '不要重写整段代码，最多引用 3 行关键代码。不要用 Markdown 标题。',
      '',
      '题目要求：',
      plainText(q.task),
      '',
      '自动测试结果：',
      lines.join('\n'),
      '',
      '候选人的代码：',
      '```js',
      code.slice(0, 12000),
      '```',
    ].join('\n')

    const ctl = new AbortController()
    const review = { status: 'thinking', text: '', error: '', ctl }
    state.reviews[q.id] = review
    renderResults()
    try {
      const { text, truncated } = await sampleFn(prompt, {
        signal: ctl.signal,
        onText: ({ text: partial }) => {
          review.status = 'streaming'
          review.text = partial
          if (state.current === q.id) renderReviewText()
        },
      })
      review.text = text
      review.status = 'done'
      if (truncated) review.error = '点评被截断了，可以删掉一些代码后再试。'
    } catch (err) {
      const code = (err && err.code) || 'upstream_error'
      review.text = (err && err.text) || review.text
      review.status = 'done'
      if (REVIEW_HIDE.has(code)) {
        sampleFn = null
        review.error = '这个页面没有获得调用 Claude 的权限，点评功能已关闭。'
      } else if (code !== 'cancelled') {
        review.error = REVIEW_ERRORS[code] || '点评中断了，可以再试一次。'
      }
    }
    if (state.current === q.id) renderResults()
  }

  /* ======================= rendering ======================= */
  function renderChrome() {
    const counts = practiceCounts()
    const plan = todayPlan()
    const doneToday = plan.filter((p) => p.done).length
    const mastered = QUESTIONS.filter((q) => (state.records[q.id]?.box || 0) >= MASTERED_BOX).length

    $('#stats').innerHTML = [
      `<span class="stat">今日 <b>${doneToday}</b> / ${plan.length || 0}</span>`,
      `<span class="stat">连续 <b>${streakDays(counts)}</b> 天</span>`,
      `<span class="stat">已掌握 <b>${mastered}</b> / ${QUESTIONS.length}</span>`,
    ].join('')

    const quotaHs = DailyPlan.quota().hs
    if (!$(`#target option[value="${quotaHs}"]`)) $('#target').insertAdjacentHTML('beforeend', `<option value="${quotaHs}">${quotaHs}</option>`)
    $('#target').value = String(quotaHs)
    const planEl = $('#plan')
    planEl.innerHTML = plan.length
      ? plan.map((item) => {
        const q = qById(item.id)
        return `<li><button type="button" class="qbtn${item.done ? ' done' : ''}" data-q="${q.id}" aria-current="${q.id === state.current}">
            <span class="check" aria-hidden="true">${item.done ? '✓' : ''}</span>
            <span class="name">${esc(q.title)}<span class="sub">${esc(item.detail)}</span></span>
            <span class="pill ${item.done ? 'today' : { due: 'due', new: 'new' }[item.kind] || 'learning'}">${item.done ? '完成' : item.reason}</span>
          </button></li>`
      }).join('') + (doneToday === plan.length ? '<li><p class="plan-empty">今天的手撕题都完成了。<a href="../index.html">回主页</a>看看力扣还剩几题。</p></li>' : '')
      : '<li><p class="plan-empty">每天的手撕题设成了 0 道。想练的话，从下面的全部题目里挑一道，或者把上面的题量调高。</p></li>'

    $('#qlist').innerHTML = QUESTIONS.map((q, i) => {
      const tier = q.tier || 'S'
      const tierHead = i === 0 || (QUESTIONS[i - 1].tier || 'S') !== tier ? `<li class="qlist-tier">${TIER_LABEL[tier]}</li>` : ''
      const s = statusOf(q.id)
      const rec = state.records[q.id]
      const sub = s.key === 'new' ? `建议 ${q.minutes} 分钟` : s.key === 'today' ? `下次 ${fmtDay(rec.due)}` : s.key === 'due' ? '今天该复习了' : `下次 ${fmtDay(rec.due)}`
      return `${tierHead}<li><button type="button" class="qbtn" data-q="${q.id}" aria-current="${q.id === state.current}">
          <span class="num">${i + 1}</span>
          <span class="name">${esc(q.title)}<span class="sub">${sub}</span></span>
          <span class="pill ${s.key}">${s.label}</span>
        </button></li>`
    }).join('')

    // heatmap: 12 columns of weeks ending with the current week
    const t = todayKey()
    const todayDate = parseKey(t)
    const start = addDays(t, -(7 * 11 + todayDate.getDay()))
    const cells = []
    for (let i = 0; i < 84; i++) {
      const day = addDays(start, i)
      if (day > t) {
        cells.push('<i style="visibility: hidden"></i>')
        continue
      }
      const n = Math.min(counts.get(day) || 0, 3)
      cells.push(`<i data-n="${n}" class="${day === t ? 'today' : ''}" title="${day}：${counts.get(day) || 0} 道"></i>`)
    }
    $('#heat').innerHTML = cells.join('')

    renderHead()
  }

  function renderHead() {
    const q = qById(state.current)
    const idx = QUESTIONS.indexOf(q)
    const s = statusOf(q.id)
    const attempt = attemptFor(q.id)
    $('#qhead').innerHTML = `
      <div class="qhead-title">
        <span class="rank">${q.tier || 'S'} · 第 ${idx + 1} 题</span>
        <h2>${esc(q.title)}</h2>
        <span class="pill ${s.key}">${s.label}</span>
      </div>
      <div class="qhead-meta">
        <label class="qpick" for="qpick">切换题目 <select id="qpick">${QUESTIONS.map((item, i) => `<option value="${item.id}"${item.id === q.id ? ' selected' : ''}>${i + 1}. ${esc(item.title)}（${statusOf(item.id).label}）</option>`).join('')}</select></label>
        <span>本次用时 <span class="timer" id="timer">${fmtClock((attempt.done ? attempt.ms : Date.now() - attempt.startedAt) || 0)}</span> / 建议 ${q.minutes}:00</span>
        ${q.anim ? `<a class="anim-link" href="${ANIM_URL}#${q.anim}" target="_blank" rel="noopener">看动画演示 ↗</a>` : ''}
      </div>`
    tickTimer()
  }

  function tickTimer() {
    const el = $('#timer')
    if (!el) return
    const q = qById(state.current)
    const attempt = attemptFor(q.id)
    const ms = attempt.done ? attempt.ms : Date.now() - attempt.startedAt
    el.textContent = fmtClock(ms)
    el.classList.toggle('finished', attempt.done)
    el.classList.toggle('over', !attempt.done && ms > q.minutes * 60000)
  }

  /* 语法着色：切词规则和配色同力扣 Hot100 页面（VS Code Light+ / Dark+）。
     这里着色的是整段代码，所以多处理了跨行的块注释和模板字符串；没写完的注释、字符串一直着色到结尾 */
  const JS_KW = new Set('var let const function class extends super new delete typeof instanceof in of void this null undefined true false'.split(' '))
  const JS_CTRL = new Set('if else for while do return break continue switch case default try catch finally throw yield await async'.split(' '))
  const TOKEN = /(\/\/[^\n]*|\/\*[\s\S]*?(?:\*\/|$))|('(?:\\.|[^'\\\n])*'?|"(?:\\.|[^"\\\n])*"?|`(?:\\[\s\S]|[^`\\])*`?)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_$][\w$]*)/g
  const FN_AFTER = /^[ \t]*(\(|=[ \t]*(function\b|async\b|\([^)\n]*\)[ \t]*=>|[A-Za-z_$][\w$]*[ \t]*=>))/
  const tokenClass = (id, rest) => {
    if (JS_CTRL.has(id)) return 'tk-k2'
    if (JS_KW.has(id)) return 'tk-k'
    if (/^[A-Z]/.test(id)) return 'tk-t'
    return FN_AFTER.test(rest) ? 'tk-f' : 'tk-v'
  }

  function highlightCode(code) {
    let out = ''
    let last = 0
    for (const m of code.matchAll(TOKEN)) {
      const [text, comment, str, num, id] = m
      out += esc(code.slice(last, m.index))
      last = m.index + text.length
      let cls = 'tk-v'
      if (comment) cls = 'tk-c'
      else if (str) cls = 'tk-s'
      else if (num) cls = 'tk-n'
      else if (id) cls = tokenClass(id, code.slice(last, last + 120))
      // multi-line tokens are split per line so every line of the overlay keeps its own spans
      out += text
        .split('\n')
        .map((part) => (part ? `<span class="${cls}">${esc(part)}</span>` : ''))
        .join('\n')
    }
    return out + esc(code.slice(last))
  }

  function renderTab() {
    const q = qById(state.current)
    const panel = $('#tabpanel')
    for (const btn of document.querySelectorAll('.tab')) btn.setAttribute('aria-selected', String(btn.dataset.tab === state.tab))
    panel.setAttribute('aria-labelledby', `tab-${state.tab}`)

    if (state.tab === 'task') {
      panel.innerHTML = `
        <div class="prose">${q.task}</div>
        <div class="prose">
          <h3>会跑的测试（☆ 是进阶，不影响通过）</h3>
          <ul class="testnames">${q.tests.map((t) => `<li class="${t.bonus ? 'bonus' : ''}">${esc(t.name)}</li>`).join('')}</ul>
        </div>`
      return
    }

    if (state.tab === 'explain') {
      panel.innerHTML = `
        <div class="prose">
          <p class="idea">${q.idea}</p>
          <h3>要点</h3>
          <ul>${q.points.map((p) => `<li>${p}</li>`).join('')}</ul>
          <h3>常见错误</h3>
          <ul>${q.pitfalls.map((p) => `<li>${p}</li>`).join('')}</ul>
          <h3>面试追问</h3>
          <div>${q.followups.map(([question, answer]) => `<details class="qa"><summary>${question}</summary><p>${answer}</p></details>`).join('')}</div>
          ${q.anim ? `<p><a class="anim-link" href="${ANIM_URL}#${q.anim}" target="_blank" rel="noopener">在动画页里一步步看这道题的执行过程 ↗</a></p>` : ''}
        </div>`
      return
    }

    if (state.tab === 'answer') {
      const attempt = attemptFor(q.id)
      if (!attempt.viewedAnswer && !attempt.done) {
        panel.innerHTML = state.revealArmed
          ? `<div class="answer-gate">
              <p>看了答案，这次通过会记为"看过答案"，明天会再安排复习。</p>
              <div class="review-row">
                <button class="btn danger" type="button" id="reveal-confirm">确定，显示答案</button>
                <button class="btn ghost" type="button" id="reveal-cancel">再想想</button>
              </div>
            </div>`
          : `<div class="answer-gate">
              <p>建议先自己写完、跑一遍测试，再来对答案。</p>
              <button class="btn" type="button" id="reveal">显示参考答案</button>
            </div>`
        return
      }
      panel.innerHTML = `
        <pre class="solution">${highlightCode(sourceOf('solution', q.id))}</pre>
        <div class="review-row">
          <button class="btn" type="button" id="copy-answer">复制答案</button>
          <span class="review-note">${attempt.viewedAnswer && !attempt.done ? '这次已记为"看过答案"。' : ''}</span>
        </div>`
      return
    }

    // record
    const rec = state.records[q.id]
    if (!rec || !Array.isArray(rec.history) || rec.history.length === 0) {
      panel.innerHTML = '<p class="empty">还没有记录。基础测试全部通过后，会自动记一次，并安排下次复习。</p>'
      return
    }
    const box = rec.box || 0
    const rows = [...rec.history].reverse().slice(0, 20).map((h) => {
      const d = parseKey(h.day)
      return `<tr><td>${d.getMonth() + 1}月${d.getDate()}日</td><td class="mono">${fmtClock(h.ms)}</td><td>${h.result === 'pass' ? '独立完成' : '看过答案'}</td></tr>`
    }).join('')
    panel.innerHTML = `
      <dl class="kv">
        <dt>熟练度</dt><dd><span class="boxes" aria-label="熟练度 ${box} / ${MAX_BOX}">${Array.from({ length: MAX_BOX }, (_, i) => `<i class="${i < box ? 'on' : ''}"></i>`).join('')}</span></dd>
        <dt>下次复习</dt><dd>${fmtDay(rec.due)}</dd>
        <dt>最快用时</dt><dd class="mono">${rec.best ? fmtClock(rec.best) : '—'}</dd>
        <dt>练习次数</dt><dd>${rec.history.length} 次</dd>
      </dl>
      <table class="history">
        <thead><tr><th>日期</th><th>用时</th><th>结果</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <p class="empty">独立完成一次，熟练度 +1，复习间隔依次是 1、3、7、14、30 天；看过答案会回到 0，第二天再练。熟练度到 ${MASTERED_BOX} 算掌握。</p>`
  }

  function renderReviewText() {
    const q = qById(state.current)
    const review = state.reviews[q.id]
    const el = $('#review-text')
    if (el && review) el.textContent = review.text || 'Claude 正在看你的代码…'
  }

  function renderResults() {
    const q = qById(state.current)
    const run = state.runs[q.id]
    const el = $('#results')
    $('#run').disabled = running
    $('#run').textContent = running ? '运行中…' : '运行测试'

    if (!run) {
      el.innerHTML = '<p class="placeholder">写好之后点"运行测试"（⌘ / Ctrl + Enter）。测试在独立的 Worker 里运行，写出死循环也不会卡住页面。</p>'
      return
    }

    const main = run.tests.filter((t) => !t.bonus)
    const bonus = run.tests.filter((t) => t.bonus)
    const passed = (list) => list.filter((t) => t.state === 'ok').length
    const allMain = !run.fatal && main.every((t) => t.state === 'ok')
    let headline = '正在运行…'
    if (run.status === 'done') headline = run.fatal ? '代码没能运行' : allMain ? '基础测试全部通过' : '还有测试没通过'

    const parts = []
    parts.push(`<div class="res-head"><strong>${headline}</strong><span class="res-count">基础 <span class="${passed(main) === main.length ? 'ok' : 'bad'}">${passed(main)}</span> / ${main.length}${bonus.length ? ` · 进阶 ${passed(bonus)} / ${bonus.length}` : ''}</span></div>`)

    const attempt = state.attempts[q.id]
    if (run.status === 'done' && allMain && attempt && attempt.done) {
      const rec = state.records[q.id]
      const next = `下次复习：${fmtDay(rec.due)}`
      const text = attempt.assisted
        ? `通过了，用时 ${fmtClock(attempt.ms)}。这次看过答案，明天再独立默写一遍。`
        : attempt.again
          ? `又通过了一次，用时 ${fmtClock(attempt.ms)}。今天已经记过，熟练度不重复增加。`
          : `独立完成，用时 ${fmtClock(attempt.ms)}，熟练度 ${rec.box} / ${MAX_BOX}。${next}`
      parts.push(`<div class="banner ${attempt.assisted ? 'warn' : 'ok'}"><span>${text}</span><span class="spacer"></span><button class="btn" type="button" id="again">再默写一遍</button></div>`)
    }

    if (run.fatal) {
      const lineText = run.fatal.line ? `第 ${run.fatal.line} 行：` : ''
      parts.push(`<pre class="fatal">${esc(lineText + run.fatal.message)}</pre>`)
      if (run.fatal.line) parts.push(`<div><button class="btn ghost" type="button" data-jump="${run.fatal.line}">跳到第 ${run.fatal.line} 行</button></div>`)
    }

    parts.push(`<ol class="tests">${run.tests.map((t) => {
      const icon = { ok: '✓', bad: '✗', running: '…', pending: '○', skipped: '–' }[t.state]
      const msg = t.state === 'bad' && t.message ? `<p class="msg">${esc((t.line ? `第 ${t.line} 行附近：` : '') + t.message)}</p>` : ''
      const ms = t.state === 'ok' || t.state === 'bad' ? `${t.ms ?? 0}ms` : t.state === 'skipped' ? '未运行' : ''
      return `<li class="test ${t.state}"><span class="icon" aria-hidden="true">${icon}</span><span>${esc(t.name)}${t.bonus ? '<span class="tag">进阶</span>' : ''}</span><span class="ms">${ms}</span>${msg}</li>`
    }).join('')}</ol>`)

    if (run.logs.length) {
      parts.push('<div class="sub-label">console 输出</div>')
      parts.push(`<pre class="console">${run.logs.map((l) => `<span class="${l.level === 'warn' ? 'warn' : l.level === 'error' ? 'error' : ''}">${esc(l.text)}</span>`).join('\n')}</pre>`)
    }

    if (sampleFn && run.status === 'done') {
      const review = state.reviews[q.id]
      const busy = review && (review.status === 'thinking' || review.status === 'streaming')
      parts.push(`<div class="review">
        <div class="review-row">
          <button class="btn" type="button" id="${busy ? 'review-stop' : 'review'}">${busy ? '停止' : review ? '重新点评' : '请 Claude 点评这段代码'}</button>
          <span class="review-note">${busy ? (review.status === 'thinking' ? 'Claude 正在看你的代码…' : '正在写点评…') : '会用你自己的 Claude 用量，第一次会询问是否允许。'}</span>
        </div>
        ${review && (review.text || busy) ? `<p class="review-text" id="review-text">${esc(review.text || 'Claude 正在看你的代码…')}</p>` : ''}
        ${review && review.error ? `<span class="review-note">${esc(review.error)}</span>` : ''}
      </div>`)
    }

    el.innerHTML = parts.join('')
  }

  function selectQuestion(qid) {
    if (!QUESTION_IDS.has(qid)) return
    if (qid !== state.current) flushDraft()
    state.current = qid
    state.revealArmed = false
    state.resetArmed = false
    $('#reset').textContent = '清空重写'
    $('#reset').classList.remove('danger')
    attemptFor(qid)
    loadCode(qid)
    try {
      history.replaceState(null, '', `#${qid}`)
    } catch {
      // hash is only a convenience
    }
    renderChrome()
    renderTab()
    renderResults()
  }

  /* ======================= events ======================= */
  document.addEventListener('click', async (e) => {
    const target = e.target.closest('button, a')
    if (!target) return
    if (target.dataset.q) {
      selectQuestion(target.dataset.q)
      if (window.matchMedia('(max-width: 1279px)').matches) {
        const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches
        $('.work').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' })
      }
      return
    }
    if (target.dataset.tab) {
      state.tab = target.dataset.tab
      state.revealArmed = false
      ls.set('hs:tab', state.tab)
      return renderTab()
    }
    if (target.dataset.jump) return editor.jump(Number(target.dataset.jump))
    switch (target.id) {
      case 'run':
        return runTests()
      case 'reset': {
        if (!state.resetArmed) {
          state.resetArmed = true
          target.textContent = '确定清空？'
          target.classList.add('danger')
          setTimeout(() => {
            if (!state.resetArmed) return
            state.resetArmed = false
            target.textContent = '清空重写'
            target.classList.remove('danger')
          }, 3000)
          return
        }
        state.resetArmed = false
        target.textContent = '清空重写'
        target.classList.remove('danger')
        ls.remove(`hs:draft:${state.current}`)
        suppressChange = true
        editor.set(sourceOf('starter', state.current))
        suppressChange = false
        return editor.focus()
      }
      case 'again': {
        const qid = state.current
        state.attempts[qid] = { startedAt: Date.now(), viewedAnswer: false, done: false }
        state.runs[qid] = null
        state.reviews[qid] = null
        ls.remove(`hs:draft:${qid}`)
        suppressChange = true
        editor.set(sourceOf('starter', qid))
        suppressChange = false
        renderHead()
        renderResults()
        if (state.tab === 'answer') renderTab()
        return editor.focus()
      }
      case 'reveal':
        state.revealArmed = true
        return renderTab()
      case 'reveal-cancel':
        state.revealArmed = false
        return renderTab()
      case 'reveal-confirm':
        attemptFor(state.current).viewedAnswer = true
        state.revealArmed = false
        return renderTab()
      case 'copy-answer': {
        const text = sourceOf('solution', state.current)
        try {
          await navigator.clipboard.writeText(text)
          toast('答案已复制')
        } catch {
          const range = document.createRange()
          range.selectNodeContents($('.solution'))
          const sel = window.getSelection()
          sel.removeAllRanges()
          sel.addRange(range)
          toast('复制被浏览器拦截了，答案已选中，按 ⌘ / Ctrl + C 复制')
        }
        return
      }
      case 'review':
        return startReview()
      case 'review-stop': {
        const review = state.reviews[state.current]
        if (review && review.ctl) review.ctl.abort()
        return
      }
      default:
    }
  })

  document.addEventListener('change', (e) => {
    if (e.target.id === 'qpick') selectQuestion(e.target.value)
  })

  $('#target').addEventListener('change', (e) => {
    DailyPlan.setQuota({ hs: Number(e.target.value) })
    renderChrome()
  })

  // the home page (another tab) can change the quota or build today's list
  window.addEventListener('storage', (e) => {
    if (e.key === DailyPlan.QUOTA_KEY || e.key === DailyPlan.HS_DAYS_KEY) renderChrome()
  })

  window.addEventListener('beforeunload', flushDraft)
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') flushDraft()
  })
  setInterval(tickTimer, 1000)

  /* ======================= boot ======================= */
  if (!['task', 'explain', 'answer', 'record'].includes(state.tab)) state.tab = 'task'
  ls.set('study:catalog:hs', QUESTIONS.map((q) => [q.id, q.title, q.tier || 'S', q.minutes]))
  const fromHash = location.hash.replace('#', '')
  const firstOpen = todayPlan().find((p) => !p.done)
  selectQuestion(QUESTION_IDS.has(fromHash) ? fromHash : firstOpen ? firstOpen.id : QUESTIONS[0].id)

  initStore().catch(() => setSync('local'))
  use('sample').then((fn) => {
    sampleFn = fn
    renderResults()
  })
})()
</script>
