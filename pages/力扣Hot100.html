*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--surface-0);color:var(--text-primary);font:15px/1.7 var(--font-sans)}
h1,h2,h3,h4{font-weight:500;margin:0}
code{font-family:var(--font-mono);font-size:.88em;background:var(--surface-1);padding:1px 5px;border-radius:5px}
button{font:inherit;font-size:14px;color:var(--text-primary);background:transparent;border:0.5px solid var(--border-strong);border-radius:var(--radius);height:34px;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
button:hover{background:var(--surface-1)}
button:active{transform:scale(.98)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--border-accent);outline-offset:1px}
button svg{width:17px;height:17px;flex:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:56px;padding:0 20px;background:var(--surface-0);border-bottom:0.5px solid var(--border)}
.top h1{font-size:16px;white-space:nowrap}
.top .sub{font-size:13px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .grow{flex:1}
.icon-btn{width:34px;padding:0}
.menu-btn{display:inline-flex}
.layout{display:grid;grid-template-columns:236px minmax(0,1fr);max-width:1560px;margin:0 auto}
@media (min-width:861px){body.nav-hidden .layout{grid-template-columns:minmax(0,1fr)}body.nav-hidden #nav{display:none}}
#nav{position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;padding:12px 10px 48px 14px;border-right:0.5px solid var(--border)}
.progress{font-size:13px;color:var(--text-secondary);padding:4px 8px 0}
.cat{margin:14px 0 2px;font-size:12px;color:var(--text-muted);padding:0 8px}
#nav a,#nav .todo{display:flex;gap:6px;align-items:baseline;padding:4px 8px;border-radius:var(--radius);font-size:14px;line-height:1.45}
#nav a{color:var(--text-primary);text-decoration:none}
#nav a:hover{background:var(--surface-1)}
#nav a[aria-current="page"]{background:var(--bg-accent);color:var(--text-accent)}
#nav .todo{color:var(--text-muted)}
#nav .num{font-family:var(--font-mono);font-size:12px;color:var(--text-muted);min-width:30px;flex:none}

main{padding:28px 36px 80px;min-width:0}
article{max-width:1240px;margin:0 auto}

#nav .today-link{margin:2px 0 4px;font-weight:500}
#nav .today-link small{margin-left:auto;font-family:var(--font-mono);font-size:12px;font-weight:400;color:var(--text-secondary)}
#nav a[aria-current="page"].today-link small{color:inherit}

#nav .mk.due::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--border-accent);vertical-align:middle}

.rv-next{font-size:14px;color:var(--text-accent);text-decoration:none;white-space:nowrap}

.today .sum b{font-weight:500;color:var(--text-primary)}

.start{margin-top:14px}
.hint{font-size:13px;color:var(--text-secondary);margin-top:10px!important}
.warn{font-size:13px;color:var(--text-danger)}

.crumb{font-size:13px;color:var(--text-secondary)}
.phead h2{font-size:22px;margin:2px 0 10px}
.tags{display:flex;flex-wrap:wrap;gap:6px}

.sec{margin-top:28px}

.why{font-size:14px;color:var(--text-secondary);margin:0 0 12px!important}

.fld{display:flex;flex-direction:column;gap:2px;flex:1 1 180px;min-width:0}

.inp-btns{display:flex;gap:8px}
.primary{background:var(--text-primary);color:var(--surface-2);border-color:transparent}

.err{font-size:13px;color:var(--text-danger);min-height:20px;margin:4px 0 2px}

.card.demo{container-type:inline-size}

#code{max-height:calc(100vh - 136px);overflow:auto}
#cv{max-height:62vh}

#ct{font-size:13px;color:var(--text-secondary);min-width:52px;text-align:right}
.codebar{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:13px;color:var(--text-secondary)}

.codebar button[aria-pressed="true"]{background:var(--bg-accent);color:var(--text-accent);border-color:transparent}
#code{position:relative;margin-top:6px;font-family:var(--font-mono);font-size:13px;line-height:1.55;border:0.5px solid var(--border);border-radius:12px;padding:10px 0;background:var(--surface-1);overflow-x:auto}
#code .hl{background:var(--code-hl);box-shadow:inset 3px 0 0 var(--border-accent)}
.tk-k{color:var(--tk-k)}.tk-k2{color:var(--tk-k2)}.tk-s{color:var(--tk-s)}.tk-n{color:var(--tk-n)}.tk-c{color:var(--tk-c)}.tk-f{color:var(--tk-f)}.tk-v{color:var(--tk-v)}.tk-t{color:var(--tk-t)}
.notes{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}

.steplink{flex:none;height:26px;font-size:12px;padding:0 9px;background:var(--bg-accent);color:var(--text-accent);border-color:transparent;font-family:var(--font-mono)}
.steplink:hover{background:var(--bg-accent);filter:brightness(.96)}
.steplink.static{display:inline-flex;align-items:center;border-radius:var(--radius);background:var(--surface-1);color:var(--text-secondary);cursor:default}
.concept{margin-top:14px!important;padding:12px 14px;border-radius:var(--radius);background:var(--surface-1);font-size:15px}
.concept b{font-weight:500}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:36px}
.pager a{color:var(--text-secondary);text-decoration:none;font-size:14px;padding:6px 0}
.pager a:hover{color:var(--text-primary)}
footer{margin-top:28px;font-size:12px;color:var(--text-muted)}
svg text{font-family:var(--font-sans)}
.t{font-size:14px;fill:var(--text-primary)}

.c-purple{--rf:var(--purple-f);--rs:var(--purple-s);--rt:var(--purple-t)}

g[class^="c-"]>text{fill:var(--rt)}

@media (prefers-reduced-motion:reduce){#ptrs g{transition:none!important}}
@media (max-width:860px){
.layout{grid-template-columns:minmax(0,1fr)}
.menu-btn{display:inline-flex}
#nav{position:fixed;top:56px;left:0;bottom:0;height:auto;width:280px;max-width:86vw;background:var(--surface-0);z-index:30;transform:translateX(-100%);transition:transform .2s ease}

main{padding:20px 16px 64px}
.card{padding:14px 12px}
.top{padding:0 12px;gap:8px}
.top .sub{display:none}
}

<script>
'use strict';
const IC={
play:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>',
pause:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M5 12l6 6M5 12l6-6"/></svg>',
right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 18l6-6M13 6l6 6"/></svg>',
replay:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11A8.1 8.1 0 0 0 4.5 9M4 5v4h4M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"/></svg>',
sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M3 12h1m8-9v1m8 8h1m-9 8v1M5.6 5.6l.7.7m12.1-.7-.7.7m0 11.4.7.7m-12.1-.7-.7.7"/></svg>',
moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3h.4a7.5 7.5 0 0 0 7.9 12.4A9 9 0 1 1 12 3z"/></svg>'
};

/* ===== 步进器引擎：来自 leetcode-js-explainer-2 的 references/stepper-templates.md =====
   绘制部分（seg / edge / box / ring / ptrInner / place / 图例 / 变量条）照搬模板，指针并排收拢的画法没有改。
   为了一页放多道题，只做了这几处扩展：
   1. 数据（H、N、E、PT、LG、S）由 mount() 换入，不再写死在脚本开头；
   2. 节点可以带第 6、7 个元素自定义宽高（柱子、宽格子），色阶写 'hide' 时不画；
   3. 代码区可以切换显示 PDF 原稿里的短注释；
   4. 输入框里打字时不响应 ←/→/空格，另加了播放速度；
   5. 模板第 5 节的调用栈版并进同一个引擎：spec.stack 为 true 时，在画布下面画「递 / 归」阶段和每一层的卡片（步骤里的 ph、f，没写就沿用上一步），没有节点时不画画布。 */
let H=240,C=[],CM=[],N={},E=[],PT={},LG=[],S=[],F=[],LGH='',PW={},s=0,timer=null,speed=1,showCm=false,STK=false;
const SPEEDS=[1,2,0.5];
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const SZ={box:[44,32],cell:[40,30],text:[40,20]};
const sz=n=>n[5]?[n[5],n[6]||30]:SZ[n[4]||'box'];

function g1({nums,target}){

const m=new Map(),slot=new Map();
S.push({l:1,v:{i:'—','target - nums[i]':'—'},n:'map = new Map()：一个空的登记簿，记「数值 → 下标」'});
for(let i=0;i<n;i++){

S.push({l:2,ptr:{i:'a'+i},v:{i},n:i===0?`第 1 轮：i = 0，0 < ${n}，进入循环，看 nums[0] = ${x}`:`i++ 变成 ${i}，${i} < ${n}，继续，看 nums[${i}] = ${x}`});
if(m.has(need)){
const j=m.get(need);
S.push({l:3,v:{'target - nums[i]':need},ring:['k'+slot.get(need)],n:`要找的搭档是 ${target} - ${p(x)} = ${need}，map 里有 ${need}，进入 if`,key:'found'});

}

}

function buildTree(arr){if(!arr.length||arr[0]===null)return null;let id=0;const mk=v=>({id:id++,val:v,left:null,right:null});const root=mk(arr[0]),q=[root];let i=1;while(q.length&&i<arr.length){const nd=q.shift();if(i<arr.length&&arr[i]!==null){nd.left=mk(arr[i]);q.push(nd.left)}i++;if(i<arr.length&&arr[i]!==null){nd.right=mk(arr[i]);q.push(nd.right)}i++}return root}
/* 按真实形状摆一棵树：根在 (x, y)，每层 y 加 dy，左右偏移逐层取 off[d]；nulls 为 true 时把 null 孩子画成浅色文字节点并用虚线连上 */
function layoutTree(root,o={}){const {x=340,y=85,dy=70,off=[120,60,30,15],nulls=true,pre='t',zpre='z'}=o;const N={},E=[];let maxY=y;const go=(t,x,y,d)=>{N[pre+t.id]=[x,y,t.val,'c-gray'];maxY=Math.max(maxY,y);for(const side of ['left','right']){const ch=t[side],cx=x+(side==='left'?-1:1)*off[d],cy=y+dy;if(ch){E.push([pre+t.id,pre+ch.id,'-']);go(ch,cx,cy,d+1)}else if(nulls){const z=zpre+t.id+(side==='left'?'L':'R');N[z]=[cx,cy,'null',0,'text'];E.push([pre+t.id,z,'-.']);maxY=Math.max(maxY,cy)}}};if(root)go(root,x,y,0);return{N,E,maxY}}
const treeDepth=t=>t?1+Math.max(treeDepth(t.left),treeDepth(t.right)):0;
const treeSize=t=>t?1+treeSize(t.left)+treeSize(t.right):0;
function g102({root:arr}){
const root=buildTree(arr),S=[],T=layoutTree(root),N=T.N,E=T.E,maxY=T.maxY;
if(!root)N.rn=[340,85,'root = null',0,'text'];
const levels=[];if(root){let c=[root];while(c.length){levels.push(c);c=c.flatMap(t=>[t.left,t.right].filter(Boolean))}}
const maxW=Math.max(1,...levels.map(x=>x.length)),yb=maxY+58,Rw=rowXs(maxW,110,56);
[['cur','c'],['nxt','n'],['vals','v']].forEach(([lab,pf],r)=>{const y=yb+r*42;N['l'+pf]=[Rw.lx,y,lab,0,'text'];for(let j=0;j<maxW;j++)N[pf+j]=[Rw.X(j),y,'','hide','cell']});
const H=yb+2*42+52,PT={a:{c:'#993C1D'}},LG=[['c-gray','还没轮到'],['c-purple','在 cur / nxt 里排队'],['c-teal','已记进 vals']];

const rowSet=(pf,arr,ramp)=>{const val={},c={};for(let j=0;j<maxW;j++){val[pf+j]=j<arr.length?arr[j]:'';c[pf+j]=j<arr.length?ramp:'hide'}return{val,c}};
S.push({l:1,n:`root 是节点 ${root.val}，不是 null，跳过这个 if`});

function parseJSON(src,name){try{return JSON.parse(src)}catch(e){throw new Error(`${name} 不是合法的格式，照力扣的写法输入，例如 [1,2,3]`)}}
const intArr=(name,{min=0,max=8,lo=-99,hi=99}={})=>src=>{const a=parseJSON(src,name);if(!Array.isArray(a)||!a.every(Number.isInteger))throw new Error(`${name} 要是整数数组，例如 [1,2,3]`);if(a.length<min||a.length>max)throw new Error(`${name} 的长度要在 ${min} 到 ${max} 之间（再长画面就放不下了）`);if(a.some(v=>v<lo||v>hi))throw new Error(`${name} 里的数要在 ${lo} 到 ${hi} 之间`);return a};
const intOne=(name,lo,hi)=>src=>{const v=parseJSON(src,name);if(!Number.isInteger(v))throw new Error(`${name} 要是一个整数`);if(v<lo||v>hi)throw new Error(`${name} 要在 ${lo} 到 ${hi} 之间`);return v};
const strArr=name=>src=>{const a=parseJSON(src,name);if(!Array.isArray(a)||!a.every(x=>typeof x==='string'))throw new Error(`${name} 要是字符串数组，例如 ["eat","tea"]`);if(a.length<1||a.length>6)throw new Error(`${name} 要有 1 到 6 个单词（再多画面就放不下了）`);if(a.some(x=>!/^[a-z]{0,5}$/.test(x)))throw new Error(`每个单词只能是 0 到 5 个小写字母`);return a};
const treeArr=name=>src=>{const a=parseJSON(src,name);if(!Array.isArray(a)||!a.every(x=>x===null||Number.isInteger(x)))throw new Error(`${name} 要是力扣的层序数组，例如 [1,2,3,null,4]`);if(a.some(x=>x!==null&&(x<-99||x>99)))throw new Error('节点值要在 -99 到 99 之间');const t=buildTree(a);if(treeSize(t)!==a.filter(x=>x!==null).length)throw new Error('有节点挂在 null 下面，不是合法的层序数组');if(treeDepth(t)>3)throw new Error('树最多 3 层（再深画面就放不下了）');return a};

1:`// 思路：边遍历边存"值 → 下标"，先查搭档 target - x 是否出现过
var twoSum = function(nums, target) {
    let map = new Map()
    for(let i = 0;i<nums.length;i++){
        // 用 has 不用 get：下标 0 是假值会误判
        if(map.has(target-nums[i])){
            return [i,map.get(target-nums[i])]
        }
        // 先查后存，避免和自己配对
        map.set(nums[i],i)

};`,

        let key = a.toString()  // "eat" → "a,e,t"

128:`// 思路：只从序列起点（x-1 不存在）开始往后数，每个数只被数一次
var longestConsecutive = function (nums) {
    let set = new Set(nums)
    let ans = 0

    // 遍历 set 而非 nums，避免重复值反复计算
    for (let x of set) {
        if (set.has(x - 1)) continue  // 不是起点，跳过
        let y = x + 1
        while (set.has(y)) {
            y++
        }
        ans = Math.max(y - x, ans)  // 序列 [x, y-1]，长度 y - x
    }

};`,
283:`// 思路：快指针找非零数，慢指针放非零数，最后补 0
var moveZeroes = function(nums) {
    let slow = 0

    for(let fast = 0;fast<nums.length;fast++){
        if(nums[fast]!==0){
            nums[slow++] = nums[fast]  // 先赋值，slow 再加 1
        }
    }
    nums.fill(0,slow)  // 从 slow 到末尾全填 0
};`,
11:`// 思路：面积由短板决定，每次移动短板才可能变大
var maxArea = function (height) {
    let l = 0
    let r = height.length - 1
    let ans = 0
    while (l < r) {
        const area = (Math.min(height[l], height[r])) * (r - l)

        if (height[l] < height[r]) l++
        else if (height[l] >= height[r]) r--  // 条件必然成立，可直接写 else
        ans = Math.max(area, ans)
    }
    return ans
};`,
15:`// 思路：排序后固定 nums[i]，右侧用 L、R 双指针找和为 0，相同值跳过去重
// 注意：sort 在循环内每轮都会执行，结果正确但会多花时间
var threeSum = function (nums) {
    let ans = []
    let len = nums.length
    for (let i = 0; i < len; i++) {
        if (len < 3 || nums === null) break
        nums.sort((a, b) => a - b)  // 必须传比较函数，默认按字符串排
        if (i > 0 && nums[i] === nums[i - 1]) continue  // 固定值去重
        let L = i + 1
        let R = len - 1
        while (L < R) {
            const sum = nums[i] + nums[L] + nums[R]
            if (sum === 0) {
                ans.push([nums[i], nums[L], nums[R]])
                while (nums[L] === nums[L + 1]) L++  // 跳过重复
                while (nums[R] === nums[R - 1]) R--
                L++
                R--
            }
            else if (sum < 0) L++
            else if (sum > 0) R--
        }
    }
    return ans
};`,
42:`// 思路：每格水量 = min(左最高, 右最高) - 自身高度；哪边最高值小，就先结算哪边
var trap = function (height) {
    let l = 0, r = height.length - 1
    let preMax = 0; let sufMax = 0; let ans = 0
    while(l<r){
        preMax=Math.max(preMax,height[l])
        sufMax=Math.max(sufMax,height[r])
        if(preMax<sufMax){
            ans+=preMax-height[l]  // 左边短板已确定
            l++
        }else{
            ans+=sufMax-height[r]  // 右边短板已确定
            r--
        }
    }
    return ans
};`,
206:`// 思路：逐个把 cur.next 改指向 pre
var reverseList = function(head) {
    let pre = null,cur = head
    while(cur){
        let nxt = cur.next  // 先存下一个，改完指针就找不到了
        cur.next = pre
        pre = cur
        cur = nxt
    }
    return pre  // 此时 cur 是 null，pre 才是新头
};`,
102:`// 思路：BFS，cur 存当前层节点，遍历时把下一层收集到 nxt
var levelOrder = function(root) {
    if(root === null) return []
    const ans = []
    let cur = [root]

    while(cur.length){
        const vals = []
        const nxt = []
        for(const a of cur){
            vals.push(a.val)
            if(a.left) nxt.push(a.left)
            if(a.right) nxt.push(a.right)
        }
        cur = nxt  // 用两个数组分层，避免 shift() 的 O(n) 开销
        ans.push(vals)
    }
    return ans
};`
};

CODE[438]=`// 思路：长度为 pLen 的定长窗口，26 位计数数组相同即为异位词
var findAnagrams = function(s, p) {
    let sLen = s.length,pLen=p.length

    if(sLen<pLen){
        return []
    }

    let ans = []
    let sCount = new Array(26).fill(0)
    let pCount = new Array(26).fill(0)

    // 统计 p 和第一个窗口
    for(let i = 0;i<pLen;i++){
        sCount[s[i].charCodeAt()-'a'.charCodeAt()]++
        pCount[p[i].charCodeAt()-'a'.charCodeAt()]++
    }

    // 数组不能用 === 直接比，转成字符串再比
    if(sCount.toString()===pCount.toString()){
        ans.push(0)
    }

    // 窗口右移：s[i] 出，s[i+pLen] 进，新起点是 i+1
    for(let i = 0;i<sLen-pLen;i++){
        sCount[s[i].charCodeAt()-'a'.charCodeAt()]--
        sCount[s[i+pLen].charCodeAt()-'a'.charCodeAt()]++

        if(sCount.toString()===pCount.toString()){
            ans.push(i+1)
        }
    }
    return ans
};`;

CODE[73]=`// 思路：先扫一遍记下哪些行、列有 0，再扫一遍把这些行列置 0
// 不能边扫边改，否则新写入的 0 会被当成原来的 0
var setZeroes = function(matrix) {
    const m = matrix.length, n = matrix[0].length
    const rowHasZero = Array(m).fill(false)
    const colHasZero = Array(n).fill(false)

    for(let i = 0; i<m;i++){
        for(let j = 0;j<n;j++){
            if(matrix[i][j]===0){
                // 连等从右往左赋值，两个都变成 true
                rowHasZero[i] = colHasZero[j] = true
            }
        }
    }

    for(let i = 0;i<m;i++){
        for(let j = 0;j<n;j++){
            if(rowHasZero[i]||colHasZero[j]){
                matrix[i][j] = 0
            }
        }
    }
};`;

CODE[54]=`// 思路：按 右→下→左→上 走，走过的格子标成 Infinity，下一步越界或已走过就右转
// 注意：会修改原矩阵
const DIRS = [[0, 1], [1, 0], [0, -1], [-1, 0]]  // 右、下、左、上

var spiralOrder = function (matrix) {
    const m = matrix.length, n = matrix[0].length
    const ans = Array(m * n)
    let i = 0, j = 0, di = 0  // di：当前方向

    for (let k = 0; k < m * n; k++) {
        ans[k] = matrix[i][j]
        matrix[i][j] = Infinity  // 标记已访问
        const x = i + DIRS[di][0]
        const y = j + DIRS[di][1]

        // 下一步越界或已访问，右转
        if(x<0||x>=m||y<0||y>=n||matrix[x][y] === Infinity){
            di = (di+1)%4
        }
        i = i + DIRS[di][0]
        j = j + DIRS[di][1]
    }
    return ans
};`;

CODE[48]=`// 思路：顺时针转 90° = 沿主对角线转置 + 每行反转
var rotate = function(matrix) {
    const n = matrix.length

    // 转置：只遍历下三角（j < i），遍历全部会交换两次又换回去
    for(let i = 0; i < n; i++){
        for(let j = 0; j < i; j++){
            const tmp = matrix[i][j]
            matrix[i][j] = matrix[j][i]
            matrix[j][i] = tmp
        }
    }

    // 每行左右反转
    for(let row of matrix){
        row.reverse()
    }
};`;

CODE[240]=`// 思路：从右上角出发，每次比较都能排除一行或一列
var searchMatrix = function (matrix, target) {
    const m = matrix.length, n = matrix[0].length
    let i = 0, j = n - 1  // 右上角
    while (i < m && j >= 0) {
        if (matrix[i][j] === target) {
            return true
        }
        if (matrix[i][j] < target) {
            i++  // 这一行左边都更小，排除整行
        } else {
            j--  // 这一列下面都更大，排除整列
        }
    }
    return false
};`;

CODE[200]=`// 思路：遇到 '1' 就 DFS 把整座岛标记掉，岛屿数 +1
var numIslands = function(grid) {
    const m = grid.length, n = grid[0].length

    function dfs(i,j){
        // 越界、是水、或已访问，都停下（注意 grid 里是字符串 '1'）
        if(i<0||i>=m||j<0||j>=n||grid[i][j]!=='1'){
            return
        }
        grid[i][j] = '2'  // 标记已访问，防止重复走
        dfs(i,j-1)
        dfs(i,j+1)
        dfs(i-1,j)
        dfs(i+1,j)

    }

    let ans = 0
    for(let i=0;i<m;i++){
        for(let j=0;j<n;j++){
            if(grid[i][j]==='1'){
                dfs(i,j)
                ans++
            }
        }
    }
    return ans
};`;

/* 一排等距的 x：T 个位置以 340 为中线，间距最多 maxGap（链表节点间距 100） */
function c_xs(T,maxGap=100,span=600){const g=T>1?Math.min(maxGap,span/(T-1)):0,x0=340-(T-1)*g/2;return j=>Math.round(x0+j*g)}
/* 同一个 key 只打在第一次出现的那一步上 */
function c_tag(S,st,key){if(!S.some(z=>z.key===key))st.key=key;return st}
/* 值数组写成 2→5，空的写 null */
function c_chain(a){return a.length?a.join('→'):'null'}
/* 有序数组（合并两个有序链表的输入） */
const c_sorted=name=>src=>{const a=intArr(name,{min:0,max:4})(src);if(a.some((v,k)=>k>0&&v<a[k-1]))throw new Error(`${name} 要按从小到大排好（题目保证链表有序）`);return a};
/* 逆序存放的数字（两数相加的输入） */
const c_digits=name=>src=>{const a=intArr(name,{min:1,max:5,lo:0,hi:9})(src);if(a.length>1&&a[a.length-1]===0)throw new Error(`${name} 的最后一个数是最高位，不能是 0（题目保证没有前导 0）`);return a};

/* 从 from 节点下方绕到 to 节点下方的折线（下 → 横 → 上，最后一段带箭头），不会穿过同一排中间的节点。
   引擎会把每条线的两端各缩进 2～3px，所以拐点处的隐形小节点要往外多放一点，三段线才能接上。dx 用来把拐点左右挪开（自环时用） */
function c_route(N,pre,from,to,y,dxF=0,dxT=0){
const ext=(a,b,d)=>{const ux=b[0]-a[0],uy=b[1]-a[1],L=Math.hypot(ux,uy)||1;return [b[0]+ux/L*d,b[1]+uy/L*d]};
const f=N[from],t=N[to],P1=[f[0]+dxF,y],P2=[t[0]+dxT,y],pt=(id,[x,yy])=>{N[pre+id]=[Math.round(x*10)/10,Math.round(yy*10)/10,'',0,'text',0.01,0.01]};
pt('A',ext(f,P1,3));pt('B',ext(P2,P1,2));pt('C',ext(P1,P2,3));pt('D',ext(t,P2,2));
return[[from,pre+'A','-'],[pre+'B',pre+'C','-'],[pre+'D',to]];
}

/* 141 / 142 共用的画法：节点排成一排，有环时从最后一个节点下方绕回入环点（不会穿过中间的节点）；
   下面一排是 visited，每个格子对齐它记下的那个节点，再下面写下标 */
function c_cyc(head,pos){
const n=head.length,X=c_xs(n+(pos<0?2:1)),yL=90,yR=140,yS=190,N={},E=[];
N.lv=[X(0),yS,'visited',0,'text'];N.lx=[X(0),yS+27,'下标',0,'text'];
head.forEach((v,k)=>{N['n'+k]=[X(k+1),yL,v,'c-gray'];N['s'+k]=[X(k+1),yS,v,'hide','cell'];N['x'+k]=[X(k+1),yS+27,k,0,'text']});
for(let k=0;k+1<n;k++)E.push(['n'+k,'n'+(k+1)]);
if(pos<0){N.nl=[X(n+1),yL,'null',0,'text'];if(n)E.push(['n'+(n-1),'nl'])}
else{const self=pos===n-1;E.push(...c_route(N,'r','n'+(n-1),'n'+pos,yR,self?18:0,self?-18:0))}
return{N,E,H:yS+27+48,id:k=>k<0?'nl':'n'+k};
}

/* ===== 160. 相交链表 ===== */
function g160({listA,listB,skipA:a,skipB:b}){
const m=listA.length,c=m-a,u=Math.max(a,b),X=c_xs(u+c+2),yA=80,yC=140,yB=200,N={},E=[],S=[];
// 列：0 放 headA / headB 标签的最左位置，1..u 是两条链各自独有的部分（靠右对齐），后面是公共段和 null
const A=[],B=[],Cm=[];
for(let k=0;k<a;k++){N['a'+k]=[X(u-a+1+k),yA,listA[k],'c-teal'];A.push('a'+k)}

N.hA=[X(u-a),yA,'headA',0,'text'];N.hB=[X(u-b),yB,'headB',0,'text'];

E.push(['hA',pathA[0]],['hB',pathB[0]]);for(const id in nx)E.push([id,nx[id]]);
const NM=id=>id==='nl'?'null':(id[0]==='a'?'A 的 ':id[0]==='b'?'B 的 ':'公共的 ')+N[id][2];

S.push({l:1,ptr:{p:P,q:Q},v:{'p 步数':0,'q 步数':0},n:`p = headA，站在${at(P)}；q = headB，站在${at(Q)}`});
while(P!==Q){

const same=P!=='nl'&&Q!=='nl'&&N[P][2]===N[Q][2],go=k===1?'进入循环':'继续';
S.push(same?c_tag(S,{l:2,n:`第 ${k} 轮：p 在${at(P)}，q 在${at(Q)}，值都是 ${N[P][2]}，但不是同一个节点，p !== q 成立，${go}`},'val'):{l:2,n:`第 ${k} 轮：p 在${at(P)}，q 在${at(Q)}，不是同一个节点，${go}`});

/* ===== 234. 回文链表 ===== */
function g234({head}){
const n=head.length,X=c_xs(n+2),yL=85,yV=185,N={},E=[],S=[];
N.lv=[X(0),yV,'vals',0,'text'];N.lx=[X(0),yV+27,'下标',0,'text'];
head.forEach((v,k)=>{N['n'+k]=[X(k+1),yL,v,'c-gray'];N['v'+k]=[X(k+1),yV,'','hide','cell'];N['x'+k]=[X(k+1),yV+27,k,0,'text'];E.push(['n'+k,k+1<n?'n'+(k+1):'nl'])});
N.nl=[X(n+1),yL,'null',0,'text'];
const vals=[];
S.push({l:1,ptr:{head:'n0'},v:{vals:'[]',i:'—',j:'—'},n:'vals = []：准备一个空数组，先把链表的值抄进来'});
for(let k=0;k<n;k++){
vals.push(head[k]);
const to=k+1<n?'n'+(k+1):'nl',tv=k+1<n?`节点 ${head[k+1]}`:' null',add={val:{['v'+k]:head[k]},c:{['v'+k]:'c-teal',['n'+k]:'c-teal'},v:{vals:fmt(vals)}};
if(k===0){

S.push({l:3,...add,n:`vals.push(head.val)：把 ${head[0]} 抄进 vals[0]`});

}else S.push({l:[2,3,4],ptr:{head:to},...add,n:`第 ${k+1} 轮同理：head 是节点 ${head[k]}，把 ${head[k]} 抄进 vals[${k}]，head 往后走到${tv}`});
}
S.push({l:2,n:`head 是 null，退出循环：vals = ${fmt(vals)}`,key:'copy'});
let i=0,j=n-1,res=true;
const vi=t=>'v'+t;
S.push({l:6,ptr:{i:vi(i),j:vi(j)},v:{i,j},n:i<j?`i = 0，j = vals.length - 1 = ${j}，0 < ${j}，进入循环`:'i = 0，j = vals.length - 1 = 0，0 < 0 不成立，只有一个值，循环一次都不进'});
while(i<j){
if(vals[i]!==vals[j]){
S.push({l:7,ring:[vi(i),vi(j)],n:`vals[${i}] = ${vals[i]}，vals[${j}] = ${vals[j]}，不相等，进入 if`});

}

}

return{H:255,N,E,PT:{head:{c:'#5F5E5A'},i:{c:'#0F6E56'},j:{c:'#993C1D'}},LG:[['c-gray','还没抄'],['c-teal','已抄进 vals'],['c-purple','首尾比过、相等']],S,res};

/* ===== 141. 环形链表 ===== */
function g141({head,pos}){
const n=head.length,L=c_cyc(head,pos),N=L.N,S=[],at=k=>`节点 ${head[k]}（下标 ${k}）`;
S.push({l:1,ptr:{head:L.id(n?0:-1)},v:{'visited.size':0},n:'visited = new Set()：用来记走过的节点（存的是节点本身，不是值）'});

for(;;){
r++;

S.push({l:2,n:`第 ${r} 轮：head 是${at(k)}，不是 null，${r===1?'进入循环':'继续'}`});
if(seen.has(k)){
S.push({l:3,ring:['s'+k,'n'+k],n:`visited 里有这个节点（下标 ${k}），has 返回 true，进入 if`,key:'hit'});

}

}

/* ===== 21. 合并两个有序链表（调用栈版） ===== */
function g21({list1:A,list2:B}){
const m=A.length,n=B.length,N={},S=[];
// 先按代码的规则排出合并后的顺序：节点的 x 就是它在结果里的位置，两排像拉链的两边一样错开
const order=[];{let i=0,j=0;while(i<m||j<n){if(j>=n||(i<m&&A[i]<B[j]))order.push('a'+i++);else order.push('b'+j++)}}
const rk={};order.forEach((id,t)=>{rk[id]=t});

var isPalindrome = function(head) {
    let vals = []
    while(head!==null){
        vals.push(head.val)

    let visited = new Set()
    while(head !== null){
        if(visited.has(head)){  // 存的是节点引用，值相同的不同节点不会误判

        }

    }

var mergeTwoLists = function (list1, list2) {
    // 出口：一边为空，直接返回另一边
    if (list1 === null) return list2
    if (list2 === null) return list1
    if (list1.val < list2.val) {
        list1.next = mergeTwoLists(list1.next, list2)
        return list1
    } else {
        list2.next = mergeTwoLists(list1, list2.next)
        return list2
    }

var addTwoNumbers = function (l1, l2) {
    const dummy = new ListNode()  // 哨兵，省去头节点特判
    let cur = dummy
    let carry = 0
    while (l1 || l2 || carry) {  // 少了 carry 会丢掉最高位的进位
        let sum = carry
        if (l1) {
            sum += l1.val
            l1 = l1.next
        }
        if (l2) {
            sum += l2.val
            l2 = l2.next
        }
        cur.next = new ListNode(sum % 10)  // 当前位
        cur = cur.next
        carry = Math.floor(sum / 10)  // 进位
    }
    return dummy.next
};`;

var removeNthFromEnd = function(head, n) {
    const dummy = new ListNode(0,head)  // 哨兵：删除头节点时也有前驱

    let right = dummy

        right = right.next
    }
    while(right.next){
        left = left.next
        right = right.next
    }

/* 在精简代码 C 里按内容找行号（from 之后第一处 trim 后完全相同的行），省得手数下标；
   146 的 JSDoc 行目前会留在 C 里，按内容找就不受影响 */
function d_L(id){const C=parseCode(CODE[id]).C.map(t=>t.trim());return (t,from=0)=>{for(let i=from;i<C.length;i++)if(C[i]===t)return i;throw new Error(`d_L(${id}) 找不到这一行：${t}`)}}
const d_chain=a=>a.length?a.join(' → '):'null';
/* 节点后面跟一个空白的 'text' 节点，用来当折线的拐点（宽高几乎为 0，线段两头只缩进 2～3px） */
const d_pt=(x,y)=>[x,y,'',0,'text',0.01,0.01];
/* 138：把 random 画成从节点下方绕过去的虚线折线。每条线占一条「车道」，横向区间不重叠的线共用一条车道。
   出发点在节点左侧 9px，到达点在节点右侧 9px，进出不会叠在一起。返回拐点节点、每个节点的折线边和车道数。 */
function d_routes(pre,rowY,rnd,X){
const N={},E={},rs=[];
rnd.forEach((j,i)=>{if(j!==null){const a=X(i)-9,b=X(j)+9;rs.push({i,lo:Math.min(a,b),hi:Math.max(a,b),a,b})}});
rs.sort((p,q)=>(p.hi-p.lo)-(q.hi-q.lo));
const lanes=[];
for(const r of rs){let l=0;while(lanes[l]&&lanes[l].some(([lo,hi])=>!(r.hi+8<lo||r.lo-8>hi)))l++;(lanes[l]=lanes[l]||[]).push([r.lo,r.hi]);r.l=l}
for(const r of rs){const y=rowY+16+12+r.l*11,k=pre+r.i;N[k+'a']=d_pt(r.a,rowY+14);N[k+'b']=d_pt(r.a,y);N[k+'c']=d_pt(r.b,y);N[k+'d']=d_pt(r.b,rowY+14);E[r.i]=[[k+'a',k+'b','-.'],[k+'b',k+'c','-.'],[k+'c',k+'d','.']]}
return{N,E,lanes:lanes.length};
}

var swapPairs = function(head) {
    const dummy = new ListNode(0,head)
    let node0 = dummy
    let node1 = head
    while(node1&&node1.next){  // 至少剩两个节点才交换
        const node2 = node1.next
        const node3 = node2.next

        node0.next = node2
        node2.next = node1
        node1.next = node3

        node0 = node1  // 交换后 node1 在后，成为下一组的前驱
        node1 = node3
    }
    return dummy.next
};`;
CODE[25]=`// 思路：先数长度，每 k 个一组按 206 的方法反转，再和前后接上
var reverseKGroup = function (head, k) {
    let n = 0
    for(let cur = head;cur;cur=cur.next){
        n++
    }
    const dummy = new ListNode(0, head)
    let lasttail = dummy  // 上一组的尾巴

    for (; n >= k; n = n - k) {  // 剩余不足 k 个就停
        let pre = null
        let cur = lasttail.next
        for (let i = 0; i < k; i++) {
            let nxt = cur.next
            cur.next = pre
            pre = cur
            cur = nxt
        }
        // 反转后 pre 是本组新头，cur 是下一组的头
        const tail = lasttail.next  // 本组原来的头，现在是尾
        tail.next = cur
        lasttail.next = pre
        lasttail = tail
    }
    return dummy.next
};`;
CODE[138]=`// 思路：递归 + Map（原节点 → 新节点），复制过的直接返回，每个节点只复制一次
var copyRandomList = function(head,cachedNode = new Map()) {  // 默认参数，首次调用时新建 Map
    if(head === null){
        return null
    }
    if(!cachedNode.has(head)){
        // 逗号运算符依次做两件事：
        // 1. 先建新节点存进 Map（必须先存，random 可能指向正在复制的节点，否则无限递归）
        // 2. 再递归复制 next、random，用 Object.assign 挂到新节点上
        cachedNode.set(head,{val:head.val}), Object.assign(cachedNode.get(head),{next:copyRandomList(head.next,cachedNode),random:copyRandomList(head.random,cachedNode)})
    }
    return cachedNode.get(head)
};`;
CODE[148]=`// 思路：归并排序。快慢指针找中点断开，两半分别排序，再合并
// 找中点并断开，返回后半段的头
function middleNode(head){
    let pre = head, slow = head, fast = head
    while(fast&&fast.next){
        pre = slow  // 记录 slow 的前一个，用于断开
        slow = slow.next
        fast = fast.next.next
    }
    pre.next = null  // 断开前后两半
    return slow
}

// 迭代合并两个有序链表
function mergeTwoLists(list1,list2){
    const dummy = new ListNode()
    let cur = dummy
    while(list1&&list2){
        if(list1.val<list2.val){
            cur.next = list1
            list1 = list1.next
        }else{
            cur.next = list2
            list2 = list2.next
        }
        cur= cur.next
    }
    cur.next = list1??list2  // 剩下的一段直接接上
    return dummy.next
}

var sortList = function(head) {
    // 出口：0 或 1 个节点，天然有序
    if(head === null || head.next === null){
        return head
    }
    let head2 = middleNode(head)

    head = sortList(head)
    head2 = sortList(head2)

    return mergeTwoLists(head,head2)
};`;

            list1 = list1.next
        }else{
            cur.next = list2
            list2 = list2.next
        }

var mergeKLists = function(lists) {
    // 合并 lists[i..j-1]（左闭右开）
    function dfs(i,j){
        const m = j-i
        if(m===0){  // 空数组
            return null
        }
        if(m===1){  // 只剩一条，不用合并
            return lists[i]
        }
        const left = dfs(i,i+(m>>1))  // m>>1 即 Math.floor(m / 2)

CODE[146]=`// 思路：Map 按插入顺序保存键。用过的键删掉再插入，就排到最后；第一个键永远是最久没用的
/**
 * @param {number} capacity
 */
var LRUCache = function(capacity) {
    this.capacity = capacity
    this.cache = new Map()
};

/**
 * @param {number} key
 * @return {number}
 */
LRUCache.prototype.get = function(key) {
    const value = this.cache.get(key)
    if(value === undefined){
        return -1
    }
    // 删掉再插入，移到"最新"位置
    this.cache.delete(key)
    this.cache.set(key,value)
    return value
};

/**
 * @param {number} key
 * @param {number} value
 * @return {void}
 */
LRUCache.prototype.put = function(key, value) {
    this.cache.delete(key)  // key 已存在时先删，保证插到末尾
    this.cache.set(key,value)
    if(this.cache.size>this.capacity){
        // keys() 迭代器的第一个就是最久没用的
        this.cache.delete(this.cache.keys().next().value)
    }
};

/**
 * Your LRUCache object will be instantiated and called as such:
 * var obj = new LRUCache(capacity)
 * var param_1 = obj.get(key)
 * obj.put(key,value)
 */`;

/* ===== 104. 二叉树的最大深度 ===== */
function g104({root:arr}){

/* ===== 226. 翻转二叉树 =====
   节点画在固定的「格子」上（按满二叉树编号 1..2^D-1，null 用到 2^(D+1)-1）。
   每次交换后重新把当前的树摆进格子：用 val / c 显示或隐藏格子，用 e 换成新的边，子树就整个搬到另一边。 */
function g226({root:arr}){

const snap=(root,done)=>{
const val={},c={},e=[],at={};

const go=(t,k)=>{at[t.id]=k;val['b'+k]=t.val;c['b'+k]=done.has(t.id)?'c-teal':'c-gray';
for(const [ch,kk] of [[t.left,2*k],[t.right,2*k+1]]){if(ch){e.push(['b'+k,'b'+kk,'-']);go(ch,kk)}else{val['z'+kk]='null';e.push(['b'+k,'z'+kk,'-.'])}}};

const N={},s0=snap(buildTree(arr),new Set()),E=s0.e;
for(let k=1;k<M1;k++)N['b'+k]=[P[k][0],P[k][1],s0.val['b'+k],s0.c['b'+k]];

const run=merge=>{
const root=buildTree(arr),done=new Set(),S=[],nil={left:'—',right:'—'},nm=t=>t?String(t.val):'null';
let cur=snap(root,done),shown=false;

for(const k in nx.val)if(nx.val[k]!==cur.val[k])val[k]=nx.val[k];

const st={val,c};if(JSON.stringify(nx.e)!==JSON.stringify(cur.e))st.e=nx.e;cur=nx;return st};

const inv=t=>{
const k=cur.at[t.id];
if(merge&&shown&&e_leaf(t)){S.push({l:[4,5,1,2,6,7,8],dash:['z'+2*k,'z'+(2*k+1)],v:{left:'null',right:'null'},...fix(t),n:`同理：${t.val} 是叶子，左右都是 null，left = right = null，交换后还是一样，返回 ${t.val}`});return t}
const go=(ch,s)=>{
const line=s==='左'?4:5,kk=s==='左'?2*k:2*k+1,name=s==='左'?'left':'right';
if(ch){S.push({l:[line,1],ptr:{root:'b'+kk},v:nil,n:`算 ${name}：去 ${t.val} 的${s}子树，root 移到 ${ch.val}，不是 null，跳过 if`});return inv(ch)}

let r=run(false);if(r.S.length>25)r=run(true);

/* ===== 101. 对称二叉树 ===== */
function g101({root:arr}){

/* ===== 原代码（照 PDF 第 16～17 页逐字转写） ===== */
CODE[94]=`// 思路：递归，按 左 → 根 → 右 的顺序访问
var inorderTraversal = function(root) {
    const ans = []
    function dfs(node){
        if(node === null){
            return
        }
        dfs(node.left)
        ans.push(node.val)  // 放在两次递归中间就是中序
        dfs(node.right)
    }

    dfs(root)
    return ans

var generateParenthesis = function (n) {
    const ans = []
    const path = Array(n * 2)

    function dfs(left, right) {
        if (right === n) {  // 右括号用完，左括号必然也用完
            ans.push(path.join(''))
            return
        }
        if (left < n) {
            path[left + right] = '('  // 按位置直接覆盖，不需要 pop
            dfs(left + 1, right)
        }
        if (right < left) {
            path[left + right] = ')'
            dfs(left, right + 1)
        }
    }
    dfs(0, 0)
    return ans
};`;

    let left = -1, right = nums.length-1

    const idx = left + Math.floor(Math.random() * (right - left + 1))

const j_str=(name,{min=1,max=10,re,hint})=>src=>{let v;try{v=JSON.parse(src)}catch(e){throw new Error(`${name} 要写成带双引号的字符串，例如 "()[]"`)}if(typeof v!=='string')throw new Error(`${name} 要写成带双引号的字符串，例如 "()[]"`);if(!re.test(v))throw new Error(`${name} 只能由${hint}组成`);if(v.length<min||v.length>max)throw new Error(`${name} 的长度要在 ${min} 到 ${max} 之间（再长画面就放不下了）`);return v};
/* 394：按「数字[内容]」的语法检查一遍，顺便算出解码后的长度和嵌套层数 */
const j_dec=name=>src=>{const s=j_str(name,{min:1,max:12,re:/^[a-z0-9[\]]*$/,hint:'小写字母、数字和方括号'})(src);let p=0,depth=0,maxD=0;const bad=m=>{throw new Error(`${name} 不是合法的编码：${m}，例如 "3[a2[c]]"`)};
const seq=()=>{let len=0;while(p<s.length&&s[p]!==']'){if(/[a-z]/.test(s[p])){len++;p++;continue}if(s[p]==='[')bad('[ 前面要有数字');const st=p;while(/[0-9]/.test(s[p]||''))p++;const num=+s.slice(st,p);if(s[st]==='0')bad('重复次数不能以 0 开头');if(s[p]!=='[')bad('数字后面要紧跟 [');p++;depth++;maxD=Math.max(maxD,depth);const inner=seq();if(s[p]!==']')bad('括号没有配对');p++;depth--;len+=inner*num;if(len>99)break}return len};
const len=seq();if(p<s.length)bad('多了一个 ]');if(len>24)throw new Error('解码后最多 24 个字符（再长画面就放不下了）');if(maxD>4)throw new Error('括号最多套 4 层（再深画面就放不下了）');return s};
/* 155：操作名数组、参数数组，照力扣两行的写法 */
const j_minOps=name=>src=>{const a=parseJSON(src,name);if(!Array.isArray(a)||!a.every(x=>typeof x==='string'))throw new Error(`${name} 要是操作名数组，例如 ["MinStack","push","getMin"]`);if(a[0]!=='MinStack')throw new Error('第一个操作必须是 "MinStack"（构造函数）');if(a.slice(1).some(x=>!['push','pop','top','getMin'].includes(x)))throw new Error('后面的操作只能是 "push"、"pop"、"top"、"getMin"');if(a.length<2||a.length>12)throw new Error(`${name} 要有 2 到 12 个操作（再多画面就放不下了）`);return a};
const j_minArgs=name=>src=>{const a=parseJSON(src,name);if(!Array.isArray(a)||!a.every(x=>Array.isArray(x)&&x.every(Number.isInteger)))throw new Error(`${name} 要是参数数组，例如 [[],[3],[]]`);return a};
const j_minCheck=({ops,args})=>{if(ops.length!==args.length)return '操作名和参数的个数要一样多';if(args[0].length)return 'MinStack 没有参数，第一个参数写成 []';let d=0;for(let i=1;i<ops.length;i++){const a=args[i],op=ops[i];if(op==='push'){if(a.length!==1||a[0]<-99||a[0]>99)return `第 ${i+1} 个操作 push 的参数要写成 [val]，val 在 -99 到 99 之间`;if(++d>6)return '栈里最多放 6 个数（再多画面就放不下了）';continue}if(a.length)return `第 ${i+1} 个操作 ${op} 没有参数，写成 []`;if(!d)return `第 ${i+1} 个操作 ${op} 时栈是空的（力扣保证 pop、top、getMin 只在非空栈上调用）`;if(op==='pop')d--}return j_opRows(ops.map((o,i)=>j_opLab(o,args[i])))?'':'操作序列太长，两排也放不下，删掉几个再试'};
/* 347：力扣保证答案唯一，所以第 k 名和第 k + 1 名的次数不能一样 */
const j_topCheck=({nums,k})=>{const m=new Map();for(const x of nums)m.set(x,(m.get(x)??0)+1);const U=m.size;if(U>6)return '不同的数最多 6 个（再多 cnt 和 ans 就放不下了）';if(k>U)return `k 不能超过不同数的个数 ${U}`;const f=[...m.values()].sort((a,b)=>b-a);if(k<U&&f[k-1]===f[k])return `第 ${k} 名和第 ${k+1} 名都出现 ${f[k]} 次，答案不唯一（力扣保证答案唯一），换一个 k 或改一下 nums`;const same={};for(const v of m.values())same[v]=(same[v]||0)+1;if(Math.max(...Object.values(same))>4)return '出现次数相同的数最多 4 个（桶再高画面就放不下了）';return ''};

/* 给这一步打上「重点留意」用的 key：同一个 key 只打在第一次出现的那一步，一步只打一个 */

var nextPermutation = function (nums) {
    const n = nums.length
    let i = n - 2
    while (i >= 0 && nums[i] >= nums[i + 1]) {
        i--
    }

    if (i >= 0) {
        let j = n - 1
        while (nums[j] <= nums[i]) {
            j--
        }
        [nums[i], nums[j]] = [nums[j], nums[i]];
    }
    let left = i + 1, right = n - 1
    while (left < right) {

 */
var rob = function (nums) {
    const n = nums.length
    const memo = Array(n).fill(-1)

    function dfs(i) {
        if (i < 0) {
            return 0
        }
        if (memo[i] !== -1) {
            return memo[i]
        }
        const res = Math.max(dfs(i - 1), dfs(i - 2) + nums[i])
        memo[i] = res
        return res
    }
    return dfs(n - 1)
};`;

    }

};`;

CODE[322]=`/**
 * @param {number[]} coins
 * @param {number} amount
 * @return {number}
 */
var coinChange = function (coins, amount) {
    if (!amount) {
        return 0
    }
    let dp = Array(amount + 1).fill(Infinity)
    dp[0] = 0

    for (let i = 0; i < coins.length; i++) {
        for (let j = coins[i]; j <= amount; j++) {
            dp[j] = Math.min(dp[j - coins[i]] + 1, dp[j])
        }
    }
    return dp[amount] === Infinity ? -1 : dp[amount]
};`;

/* ===================== N 组：多维动态规划（62 64 5 1143 72） =====================
   二维 DP 表不放指针（有指针的行要隔 80，表会太高）：正在算的格子用 ring 实线框，它依赖的格子用 dash 虚线框，算完换成紫色。
   原数据摆在表外：64 的 grid 画在 dp 左边，1143 / 72 的两个字符串一个竖着摆在表左边、一个横着摆在表上方。
   表大了步数会超过 25：用 n_plan 按预算挑详细程度，靠前的行逐格走，后面的行合成「这一行同理」一步。 */

/* 一排等距的 x：一共 k 个位置、间距 g、以 340 为中线，返回第 t 个（从 0 数）的 x */
function n_xs(k,g){const x0=340-(k-1)*g/2;return t=>Math.round(x0+t*g)}

/* 按步数预算挑每一段（表的一行，或者 5 题的一次 helper 调用）的详细程度。
   segs[k] = {full, mid?, lite}：full 逐行走，mid 每格合成一步，lite 整段一步。
   从第一段开始，放得下 full 就用 full，否则试 mid，都放不下就从这一段起全用 lite（保证前面的段比后面的细）。
   步骤上的 _k 是「重点留意」的标签，只打在拼好以后第一次出现的那一步上。 */
function n_plan(pre,segs,post,limit=25){
let total=pre.length+post.length+segs.reduce((a,s)=>a+s.lite.length,0),k=0;const out=[...pre];
for(;k<segs.length;k++){const sg=segs[k],base=total-sg.lite.length;
if(base+sg.full.length<=limit){out.push(...sg.full);total=base+sg.full.length;continue}
if(sg.mid&&base+sg.mid.length<=limit){out.push(...sg.mid);total=base+sg.mid.length;continue}
break}
for(;k<segs.length;k++)out.push(...segs[k].lite);
out.push(...post);
const seen=new Set();for(const st of out){if(st._k&&!seen.has(st._k)){seen.add(st._k);st.key=st._k}delete st._k}
return out}

const n_q=s=>`"${s}"`;

/* 1143 / 72 共用的表：A 竖着摆在表左边（第 i 行对应 A[i-1]），B 横着摆在表上方（第 j 列对应 B[j-1]）；
   第 0 行、第 0 列代表空串，对应位置写 ""。最左边一列是行号 i，最上面一排是列号 j。 */
function n_strTable(A,B,labA,labB){
const m=A.length,n=B.length,N={},X=n_xs(n+3,56),xl=X(0),xc=X(1),xt=j=>X(j+2),yJ=30,yB=64,Y=i=>110+i*44;
N.labA=[xc,yJ,labA,0,'text'];N.labB=[xl,yB,labB,0,'text'];
for(let j=0;j<=n;j++){N['jl'+j]=[xt(j),yJ,'j = '+j,0,'text'];N['b'+j]=j?[xt(j),yB,B[j-1],'c-teal','cell']:[xt(0),yB,'""',0,'text']}
for(let i=0;i<=m;i++){N['il'+i]=[xl,Y(i),'i = '+i,0,'text'];N['a'+i]=i?[xc,Y(i),A[i-1],'c-teal','cell']:[xc,Y(0),'""',0,'text'];for(let j=0;j<=n;j++)N[`d${i}_${j}`]=[xt(j),Y(i),0,'c-gray','cell']}
return{N,H:Y(m)+58,d:(i,j)=>`d${i}_${j}`}}

/* ===== 62. 不同路径 ===== */
function g62({m,n}){
const X=n_xs(n+1,60),xl=X(0),xt=j=>X(j+1),Y=i=>76+i*46,N={},id=(i,j)=>`f${i}_${j}`;
for(let j=0;j<n;j++)N['jl'+j]=[xt(j),34,'j = '+j,0,'text'];
for(let i=0;i<m;i++){N['il'+i]=[xl,Y(i),'i = '+i,0,'text'];for(let j=0;j<n;j++)N[id(i,j)]=[xt(j),Y(i),0,'c-gray','cell']}
const f=Array.from({length:m},()=>Array(n).fill(0));
const pre=[{l:1,v:{i:'—',j:'—'},n:`f[i][j] = 从左上角走到 (i, j) 的路径数；先建 ${m} × ${n} 的表，全填 0`,_k:'init'}];
{const val={},c={};for(let i=0;i<m;i++){f[i][0]=1;val[id(i,0)]=1;c[id(i,0)]='c-teal'}pre.push({l:[2,3],val,c,n:'第 0 列全填 1：一直往下走到 (i, 0)，只有 1 条路',_k:'border'})}
{const val={},c={};for(let j=0;j<n;j++){f[0][j]=1;val[id(0,j)]=1;c[id(0,j)]='c-teal'}pre.push({l:[5,6],val,c,n:'第 0 行全填 1：一直往右走到 (0, j)，也只有 1 条路'})}
const segs=[];
for(let i=1;i<m;i++){
const start={l:8,v:{i,j:'—'},n:i===1?`i = 1，1 < ${m}，进入外层循环，从第 1 行开始算`:`i = ${i}，${i} < ${m}，继续算第 ${i} 行`};
const full=[start],mid=[{...start}],cells=[],val={},c={};
for(let j=1;j<n;j++){
const a=f[i-1][j],b=f[i][j-1],v=a+b,me=id(i,j);f[i][j]=v;val[me]=v;c[me]='c-purple';cells.push(me);
const put={val:{[me]:v},c:{[me]:'c-purple'},ring:[me],dash:[id(i-1,j),id(i,j-1)]};
full.push({l:9,v:{j},n:j===1?`j = 1，1 < ${n}，进入内层循环`:`j = ${j}，${j} < ${n}，继续`});
full.push({l:10,...put,n:`f[${i}][${j}] = 上 f[${i-1}][${j}] + 左 f[${i}][${j-1}] = ${a} + ${b} = ${v}`,_k:'sum'});
mid.push({l:[9,10],v:{j},...put,n:`j = ${j}：f[${i}][${j}] = 上 ${a} + 左 ${b} = ${v}`,_k:'sum'});
}

full.push(exit);mid.push({...exit});
const lite=[{l:n>1?[8,9,10]:[8,9],v:{i,j:n},val,c,ring:cells,n:n>1?`i = ${i} 这一行同理，从左往右：f[${i}][1..${n-1}] 依次是 ${cells.map(x=>val[x]).join('、')}`:`i = ${i}：j = 1，1 < 1 不成立，内层一次都不进`}];
segs.push({full,mid,lite});
}
const ans=f[m-1][n-1];
const post=[{l:8,v:{i:m,j:'—'},n:m===1?'i = 1，1 < 1 不成立：只有一行，外层循环一次都不进':`i = ${m}，${m} < ${m} 不成立，退出循环`},
{l:13,ring:[id(m-1,n-1)],n:`返回 f[${m-1}][${n-1}] = ${ans}：从左上角走到右下角一共 ${ans} 条路`}];

/* ===== 64. 最小路径和（从终点倒着填） ===== */
function g64({grid:inp}){
const grid=inp.map(r=>[...r]),m=grid.length,n=grid[0].length,N={};
const X=n_xs(2*n+2,n<=4?56:50),xl=X(0),xg=j=>X(1+j),xd=j=>X(n+2+j),Y=i=>90+i*46;
const G=(i,j)=>`g${i}_${j}`,D=(i,j)=>`d${i}_${j}`;
N.tg=[(xg(0)+xg(n-1))/2,24,'grid',0,'text'];N.td=[(xd(0)+xd(n-1))/2,24,'dp',0,'text'];
for(let j=0;j<n;j++){N['gj'+j]=[xg(j),52,'j = '+j,0,'text'];N['dj'+j]=[xd(j),52,'j = '+j,0,'text']}
for(let i=0;i<m;i++){N['il'+i]=[xl,Y(i),'i = '+i,0,'text'];for(let j=0;j<n;j++){N[G(i,j)]=[xg(j),Y(i),grid[i][j],'c-teal','cell'];N[D(i,j)]=[xd(j),Y(i),0,'c-gray','cell']}}
const dp=Array.from({length:m},()=>Array(n).fill(0)),E0=D(m-1,n-1);
dp[m-1][n-1]=grid[m-1][n-1];
const pre=[{l:[1,2],v:{m,n,i:'—',j:'—'},n:`m = ${m}，n = ${n}；dp[i][j] = 从 (i, j) 走到右下角的最小路径和，先全填 0`},
{l:3,val:{[E0]:dp[m-1][n-1]},c:{[E0]:'c-purple'},ring:[E0],dash:[G(m-1,n-1)],n:`终点先填好：dp[${m-1}][${n-1}] = grid[${m-1}][${n-1}] = ${dp[m-1][n-1]}，从终点到终点只算它自己`}];
const segs=[];
for(let i=m-1;i>=0;i--){
const start={l:4,v:{i,j:'—'},n:i===m-1?`i = ${i}，${i} >= 0，进入外层循环：从最后一行开始，倒着往上算`:`i = ${i}，${i} >= 0，继续，往上算第 ${i} 行`};
const full=[start],mid=[{...start}],cells=[],val={},c={},used=new Set([4,5]);
for(let j=n-1;j>=0;j--){
const me=D(i,j),gv=grid[i][j];let st;
if(i===m-1&&j===n-1)st={l:[6,8,10],ring:[me],n:`(${i}, ${j}) 是终点：三个条件都不成立，什么都不做，dp 保持 ${dp[i][j]}`,_k:'corner'};
else if(i===m-1){const r=dp[i][j+1],v=r+gv;dp[i][j]=v;st={l:[6,7],dash:[D(i,j+1),G(i,j)],n:`最后一行只能往右走：dp[${i}][${j}] = 右边 ${r} + grid ${gv} = ${v}`,_k:'right'}}
else if(j===n-1){const d=dp[i+1][j],v=d+gv;dp[i][j]=v;st={l:[6,8,9],dash:[D(i+1,j),G(i,j)],n:`最后一列只能往下走：dp[${i}][${j}] = 下边 ${d} + grid ${gv} = ${v}`,_k:'down'}}
else{const d=dp[i+1][j],r=dp[i][j+1],mn=Math.min(d,r),v=mn+gv;dp[i][j]=v;st={l:[6,8,10,11],dash:[D(i+1,j),D(i,j+1),G(i,j)],n:`往下 ${d}、往右 ${r}，取小的 ${mn}${d===r?'（一样大）':''}，加 grid ${gv}：dp[${i}][${j}] = ${v}`,_k:'min'}}
if(!(i===m-1&&j===n-1)){Object.assign(st,{val:{[me]:dp[i][j]},c:{[me]:'c-purple'},ring:[me]});val[me]=dp[i][j];c[me]='c-purple';cells.push(me)}
for(const x of st.l)used.add(x);
full.push({l:5,v:{j},n:j===n-1?`j = ${j}，${j} >= 0，进入内层循环：从最后一列开始往左`:`j = ${j}，${j} >= 0，继续`},st);
mid.push({...st,l:[5,...st.l],v:{j},n:`j = ${j}：${st.n}`});
}
const exit={l:5,v:{j:-1},n:`j = -1，-1 >= 0 不成立，第 ${i} 行算完`};
full.push(exit);mid.push({...exit});
const j0=i===m-1?n-2:n-1;
const lite=[{l:[...used].sort((x,y)=>x-y),v:{i,j:-1},val,c,ring:cells,n:cells.length?`i = ${i} 这一行同理，从右往左：dp[${i}][${j0}..0] 依次是 ${cells.map(x=>val[x]).join('、')}`:`i = ${i}：这一行只有终点，三个条件都不成立，跳过`}];
segs.push({full,mid,lite});

{l:15,ring:[D(0,0)],dash:path.map(([i,j])=>G(i,j)),n:`返回 dp[0][0] = ${ans}：最省的走法是 ${path.map(([i,j])=>grid[i][j]).join(' → ')}`}];
return{H:Y(m-1)+58,N,E:[],PT:{},LG:[['c-teal','grid 原数据'],['c-purple','已算出'],['c-gray','还没算']],S:n_plan(pre,segs,post),res:ans};

/* ===== 5. 最长回文子串（中心扩展） ===== */
function g5({s}){

const resRow=(r,lo)=>{const val={},c={re:'hide'},ring=[];for(let k=0;k<L;k++){const on=k>=lo&&k<lo+r.length;val['r'+k]=on?s[k]:'';c['r'+k]=on?'c-purple':'hide';if(on)ring.push('r'+k)}return{val,c,ring}};
const pre=[{l:1,v:{i:'—',m:'—',n:'—',res:'—'},n:`s.length = ${L}，不小于 2，跳过 if`},{l:4,c:{re:'c-gray'},v:{res:'""'},n:"res = ''：目前找到的最长回文是空串"}];
let res='',pos=null;const segs=[];
for(let i=0;i<L;i++)for(const odd of [true,false]){
const a=i,b=odd?i:i+1,old=res,tr=[];let mm=a,nn=b;
while(mm>=0&&nn<L&&s[mm]===s[nn]){tr.push([mm,nn]);mm--;nn++}
const len=nn-mm-1,upd=len>old.length;if(upd){res=s.slice(mm+1,nn);pos=[mm+1,nn-1]}

CODE[62]=`/**
 * @param {number} m
 * @param {number} n
 * @return {number}
 */
var uniquePaths = function (m, n) {
    const f = new Array(m).fill(0).map(() => new Array(n).fill(0))
    for (let i = 0; i < m; i++) {
        f[i][0] = 1
    }
    for (let j = 0; j < n; j++) {
        f[0][j] = 1
    }
    for (let i = 1; i < m; i++) {
        for (let j = 1; j < n; j++) {
            f[i][j] = f[i - 1][j] + f[i][j - 1]
        }
    }
    return f[m - 1][n - 1]
};`;
CODE[64]=`/**
 * @param {number[][]} grid
 * @return {number}
 */
var minPathSum = function (grid) {
    const m = grid.length, n = grid[0].length
    const dp = new Array(m).fill(0).map(() => new Array(n).fill(0))

    dp[m - 1][n - 1] = grid[m - 1][n - 1]

    for (let i = m - 1; i >= 0; i--) {
        for (let j = n - 1; j >= 0; j--) {
            if (i === m - 1 && j !== n - 1) {
                dp[i][j] = dp[i][j + 1] + grid[i][j]
            } else if (i !== m - 1 && j === n - 1) {
                dp[i][j] = dp[i + 1][j] + grid[i][j]
            } else if(i !== m-1 && j !== n-1) {
                dp[i][j] = Math.min(dp[i + 1][j], dp[i][j + 1]) + grid[i][j]
            }
        }
    }
    return dp[0][0]
};`;

 * @return {string}
 */
var longestPalindrome = function (s) {
    if(s.length < 2){
        return s
    }
    let res = ''
    for (let i = 0; i < s.length; i++) {
        helper(i, i)
        helper(i, i + 1)
    }

    function helper(m, n) {
        while (m >= 0 && n < s.length && s[m] === s[n]) {
            m--
            n++
        }

        if (n - m - 1 > res.length) {
            res = s.slice(m + 1, n)
        }
    }
    return res

var longestCommonSubsequence = function (text1, text2) {
    const m = text1.length, n = text2.length
    const dp = new Array(m + 1).fill(0).map(() => new Array(n + 1).fill(0))
    for (let i = 1; i <= m; i++) {

function n_grid(name,{maxR=4,maxC=5,lo=0,hi=99}={}){return src=>{
const a=parseJSON(src,name),ex='[[1,3],[2,4]]';
if(!Array.isArray(a)||!a.length||!a.every(r=>Array.isArray(r)&&r.length))throw new Error(`${name} 要是非空的二维数组，例如 ${ex}`);
if(!a.every(r=>r.every(Number.isInteger)))throw new Error(`${name} 里要都是整数，例如 ${ex}`);
const n=a[0].length;
if(!a.every(r=>r.length===n))throw new Error(`${name} 每一行的长度要一样`);
if(a.length>maxR)throw new Error(`${name} 最多 ${maxR} 行（再多画面就放不下了）`);
if(n>maxC)throw new Error(`${name} 最多 ${maxC} 列（再多画面就放不下了）`);
if(a.some(r=>r.some(v=>v<lo||v>hi)))throw new Error(`${name} 里的数要在 ${lo} 到 ${hi} 之间`);
return a}}
function n_word(name,{min=0,max=6,re=/^[a-z]*$/,what='小写英文字母'}={}){return src=>{
const s=parseJSON(src,name);
if(typeof s!=='string')throw new Error(`${name} 要是带双引号的字符串，例如 "abc"`);
if(s.length<min||s.length>max)throw new Error(`${name} 的长度要在 ${min} 到 ${max} 之间（再长画面就放不下了）`);
if(!re.test(s))throw new Error(`${name} 只能包含${what}`);
return s}}

notes:[{k:'corner',t:'终点在循环里三个条件都不成立，什么都不做，值是循环前那一行填好的。所以第三个条件不能偷懒写成 `else`：那样终点会走进去，读 `dp[i + 1][j]` 时 dp[2] 是 undefined，直接报 TypeError。去掉循环前那一行的话终点保持 0，这个例子会返回 8，正确是 11。'},{k:'right',t:'dp[1][1] = 8 的意思是：从 (1, 1) 出发走到终点最少花 8（5 + 3）。最后一行再往下就出界了，所以只看右边一格；最后一列同理只看下边。'},{k:'min',t:'取 min 时要求下边和右边两格都已经算好：i、j 都从大往小走，正好保证这一点。如果把两层循环改成从 0 往上走，dp[i + 1][j] 还是 0，会被当成最省的后路，这个例子会返回 2。'}],
extra:'只有一行时（比如 [[1,2,3]]）只会走「最后一行」分支，只有一列时只走「最后一列」分支，答案就是整行（列）的和；1 × 1 的 grid 循环里只有终点，直接返回 grid[0][0]。',
concept:'dp 的方向：这份代码定义的是「从 (i, j) 走到终点」，所以倒着填、答案在 dp[0][0]；更常见的写法是「从起点走到 (i, j)」，正着填、答案在 dp[m-1][n-1]。两种都对，关键是填表顺序要保证依赖的格子先算好。好比导航：可以记「从出发点已经走了多远」，也可以记「离目的地还剩多远」。'});

PROBLEMS.push({id:5,title:'最长回文子串',cat:'多维动态规划',method:'中心扩展',time:'O(n²)',space:'O(1)',gen:g5,
fields:[{k:'s',def:'"aaba"',parse:n_word('s',{min:1,max:8,re:/^[a-zA-Z0-9]*$/,what:'英文字母和数字'})}],
intuition:'回文从中间往两边是对称的。把每个位置当成「中心」，两只手 m、n 从中心同时往外推，两边字符相同就继续推，不同或碰到边就停。中心有两种：一个字符（奇数长度，如 "aba"）和两个字符的中间（偶数长度，如 "aa"）。',
why:'选 s = "aaba"：res 更新了三次（"a" → "aa" → "aba"），偶数中心和奇数中心都能扩出回文；停下的原因三种都有：左边越界、右边越界、两边不相等。前两次调用逐行走，后面的调用每次合成一步。',
notes:[{k:'hoist',t:'第一次调用 helper 时，它的定义写在循环下面。能调用是因为 `function helper(m, n) {...}` 是函数声明，会被提升到整个函数顶部；改成 `const helper = (m, n) => {...}` 还放在循环后面，就会报 ReferenceError。'},{k:'len',t:'while 停下时 m、n 都多走了一步，回文是 s[m + 1] 到 s[n - 1]，所以长度是 n - m - 1，取子串是 `s.slice(m + 1, n)`（slice 不含结尾）。这里 m = -1：1 - (-1) - 1 = 1。写成 n - m + 1 的话单个 "a" 会被当成长度 3。'},{k:'even',t:'偶数中心 helper(0, 1) 找到了 "aa"。如果只试 helper(i, i)，就只能找到奇数长度的回文：输入 "abba" 会返回 "a"，正确是 "abba"。'}],
extra:'s 只有 1 个字符时（比如 "x"），`s.length < 2` 成立，直接返回 s，后面都不走。',
concept:'m、n 是回文外面的两个边界：循环结束时 s[m]、s[n] 要么越界、要么不相等，都不属于回文，回文是夹在它们中间的部分。好比两个人背靠背从中间往外走，踩到不一样的地砖才停，停下那一步已经出了回文的范围。'});

PROBLEMS.push({id:1143,title:'最长公共子序列',cat:'多维动态规划',method:'二维 DP',time:'O(mn)',space:'O(mn)',gen:g1143,
fields:[{k:'text1',def:'"ac"',parse:n_word('text1',{min:1,max:5})},{k:'text2',def:'"abc"',parse:n_word('text2',{min:1,max:6})}],
intuition:'dp[i][j] 是 text1 前 i 个字符和 text2 前 j 个字符的最长公共子序列长度。只看两边各自的最后一个字符：相同就配成一对，在左上角的基础上 + 1；不同就至少有一个用不上，扔掉 text1 的看上面、扔掉 text2 的看左边，取大的。',
why:'选 text1 = "ac"，text2 = "abc"：相等走对角线出现两次；不相等时取左边（两次）、取上面、上和左一样大都出现了。答案 "ac" 跳过了 text2 中间的 "b"，能看出子序列不要求连续。',
notes:[{k:'pad',t:'表比字符串多一行一列：第 0 行、第 0 列代表空串，LCS 都是 0。这样 i = 1 时读 `dp[i - 1][...]` 也不会越界，不用单独处理边界；代价是下标错一位，dp[i][j] 对应的字符是 `text1[i - 1]` 和 `text2[j - 1]`。'},{k:'eq',t:'字符相同时用的是左上角 dp[i - 1][j - 1]：两边都去掉这对字符以后的结果，再加上这一对。写成左边 + 1 的话，同一个字符会被配对两次：text1 = "a"、text2 = "aa" 会得到 2，正确是 1。'},{k:'neq',t:'不相等时不清零，而是继承上和左里大的那个：上面是「不用 c1」的最好结果，左边是「不用 c2」的最好结果，前面已经配好的对不会丢。'}],
extra:'两个字符串完全没有公共字符时（比如 "ab" 和 "cd"），每一格都走 else，整张表都是 0，返回 0。',
concept:'子序列和子串的区别：子序列可以隔着挑，不要求连续，所以字符不同时继承上或左的较大值；「最长公共子串」要求连续，字符不同时要把 dp[i][j] 设成 0，答案取全表最大值。好比两个人按顺序从书架上挑书，子序列可以隔着拿，子串必须一本挨一本。'});

PROBLEMS.push({id:72,title:'编辑距离',cat:'多维动态规划',method:'二维 DP',time:'O(mn)',space:'O(mn)',gen:g72,
fields:[{k:'word1',def:'"ab"',parse:n_word('word1',{min:0,max:5})},{k:'word2',def:'"acd"',parse:n_word('word2',{min:0,max:6})}],
intuition:'dp[i][j] 是把 word1 前 i 个字符改成 word2 前 j 个字符最少要几步。只看最后一个字符：相同就不用动它，等于左上角；不同就三选一，替换（左上 + 1）、删掉 word1 的这个字符（上 + 1）、插入 word2 的这个字符（左 + 1），取最少的。',
why:'选 word1 = "ab"，word2 = "acd"：有一格字符相等；不相等的格子里，插入（两次）、删除、替换都各自当过唯一的最小值，最后一格替换和插入一样多。答案 2 就是「b 换成 c，再插入 d」。',
notes:[{k:'border',t:'第 0 列、第 0 行是递推的起点：和空串之间只能一个个删或一个个插，长度是几就要几步。漏掉这两个循环（边界保持 0）的话，word1 = "a"、word2 = "bc" 会算出 1，正确是 2。'},{k:'eq',t:'最后一个字符相同就不花步数，直接等于左上角（两边都去掉这个字符）。这时左上角不会比另外两条路差，所以代码不用再取 min，也不 + 1。'},{k:'min',t:'三个来源对应三种操作：左上 + 1 是把 word1[i - 1] 换成 word2[j - 1]；上 + 1 是删掉 word1[i - 1]；左 + 1 是在末尾插入 word2[j - 1]。这一格插入最少：先把 "a" 变成 "a"（0 步），再插入 "c"。'}],

function todayPlan(){const t=todayStr();if(SRS.days[t]&&Array.isArray(SRS.days[t].list))return SRS.days[t];
const due=[],fresh=[],rest=[];for(const P of PROBLEMS){const c=SRS.cards[P.id];if(!c)fresh.push(P.id);else if(c.due<=t)due.push(P.id);else rest.push(P.id)}
const C_=id=>SRS.cards[id];due.sort((a,b)=>C_(a).due.localeCompare(C_(b).due)||(C_(b).lapses||0)-(C_(a).lapses||0));rest.sort((a,b)=>C_(a).last.localeCompare(C_(b).last)||C_(a).due.localeCompare(C_(b).due));

<div class="stage">
<h4 class="sr-only">力扣 ${P.id} ${P.title}的步进演示：上方是数据结构和指针，中间是字幕、变量和播放进度条，下方是同步高亮的代码</h4>
<svg id="cv" viewBox="0 0 680 240" width="100%" role="img" aria-label="数据结构画布"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--text-secondary)"/></marker></defs><g id="lay"></g><g id="ptrs"></g></svg>
<div id="cap" style="text-align:center;font-size:16px;min-height:52px;margin:4px 0 6px;line-height:1.6" aria-live="polite"></div>
<div id="vars" style="display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-bottom:12px"></div>
<div class="ctrl">
<button type="button" id="rs" aria-label="重播">${IC.replay}</button>
<button type="button" id="pv" aria-label="上一步">${IC.left}</button>
<button type="button" id="pl" style="min-width:84px"><span id="pli" style="display:inline-flex">${IC.play}</span> <span id="plt">播放</span></button>
<button type="button" id="nx" aria-label="下一步">${IC.right}</button>
<input type="range" id="sl" min="0" max="1" step="1" value="0" aria-label="进度">
<span id="ct"></span>
<button type="button" id="spd" aria-label="播放速度">${speed}×</button>
</div>
<div id="stk" hidden></div>
</div>
<div class="codecol">
<div class="codebar"><span>代码（←/→ 单步，空格播放）</span><button type="button" id="cmt" aria-pressed="${showCm}">${showCm?'隐藏注释':'显示注释'}</button></div>
<div id="code"></div>
</div>
</div>
</section>
<section class="sec"><h3>重点留意</h3><ol class="notes">${notes}</ol><p class="concept"><b>容易混淆：</b>${md(P.concept)}</p></section>
<nav class="pager" aria-label="上一题 / 下一题">${prev?`<a href="#${prev.id}">← ${prev.id}. ${prev.title}</a>`:'<span></span>'}${next?`<a href="#${next.id}">${next.id}. ${next.title} →</a>`:'<span></span>'}</nav>
<footer>代码与 PDF 原稿一致，只恢复了缩进；演示的画法、字幕和步骤粒度按 leetcode-js-explainer-2 的步进器规范。</footer>
</article>`;
$('pl').onclick=()=>timer?stop():play();
$('pv').onclick=()=>{stop();go(s-1)};
$('nx').onclick=()=>{stop();go(s+1)};
$('rs').onclick=()=>{stop();go(0);play()};
$('sl').oninput=e=>{stop();go(+e.target.value)};
$('spd').onclick=()=>{speed=SPEEDS[(SPEEDS.indexOf(speed)+1)%SPEEDS.length];$('spd').textContent=speed+'×';if(timer){stop();play()}};
$('cmt').onclick=()=>{showCm=!showCm;store.set('lc-cm',showCm?'1':'0');$('cmt').setAttribute('aria-pressed',showCm);$('cmt').textContent=showCm?'隐藏注释':'显示注释';render()};
$('inp').onsubmit=e=>{e.preventDefault();runCustom()};
$('inp').oninput=e=>{e.target.removeAttribute('aria-invalid');$('err').textContent=''};
$('rst').onclick=resetDefault;
for(const b of $('main').querySelectorAll('.steplink[data-step]'))b.onclick=()=>{if(!isDefault)resetDefault();stop();go(+b.dataset.step);$('cv').scrollIntoView({behavior:'smooth',block:'center'})};
markNav(P.id);renderRV(P.id);setMode(true);mount(P.def);
document.body.classList.remove('nav-open');syncMenu();
}
const isNarrow=()=>matchMedia('(max-width:860px)').matches;
function syncMenu(){const open=isNarrow()?document.body.classList.contains('nav-open'):!document.body.classList.contains('nav-hidden');$('menu').setAttribute('aria-expanded',open);$('menu').setAttribute('aria-label',isNarrow()?'题目列表':open?'收起题目列表':'展开题目列表')}
function resetDefault(){const P=curP;for(const f of P.fields){const el=$('inp').elements[f.k];el.value=f.def;el.removeAttribute('aria-invalid')}$('err').textContent='';setMode(true);mount(P.def)}
function runCustom(){
const P=curP,input={};
for(const f of P.fields){const el=$('inp').elements[f.k];try{input[f.k]=f.parse(el.value.trim())}catch(err){el.setAttribute('aria-invalid','true');$('err').textContent=err.message;el.focus();return}}
const msg=P.check?P.check(input):'';if(msg){$('err').textContent=msg;return}
$('err').textContent='';
const same=P.fields.every(f=>JSON.stringify(input[f.k])===JSON.stringify(P.defIn[f.k]));
setMode(same);mount(same?P.def:P.gen(input));
}
function applyTheme(t){if(t)document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme;const dark=t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;$('theme').innerHTML=dark?IC.sun:IC.moon}
function init(){
showCm=store.get('lc-cm')==='1';srsLoad();
applyTheme(store.get('lc-theme'));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>applyTheme(document.documentElement.dataset.theme));
$('theme').onclick=()=>{const t=document.documentElement.dataset.theme,dark=t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches,nt=dark?'light':'dark';applyTheme(nt);store.set('lc-theme',nt)};
if(store.get('lc-nav')==='0')document.body.classList.add('nav-hidden');
$('menu').onclick=()=>{if(isNarrow())document.body.classList.toggle('nav-open');else{const hid=document.body.classList.toggle('nav-hidden');store.set('lc-nav',hid?'0':'1');if(F.length){fitView();reserve();keepLineInView()}}syncMenu()};
$('scrim').onclick=()=>{document.body.classList.remove('nav-open');syncMenu()};
buildNav();
addEventListener('hashchange',route);
let rz=0;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(F.length){fitView();reserve()}syncMenu()},120)});
document.addEventListener('keydown',e=>{const t=e.target;if(t.closest&&t.closest('input,textarea,select'))return;if(e.metaKey||e.ctrlKey||e.altKey||!F.length||!curP)return;if(e.key==='ArrowRight'){stop();go(s+1)}if(e.key==='ArrowLeft'){stop();go(s-1)}if(e.key===' '){e.preventDefault();timer?stop():play()}});
route();
}
if(typeof document!=='undefined'&&document.getElementById('main'))init();
</script>
</body>
</html>
